<link rel="manifest" href='data:application/manifest+json,{"name":"רונית פינץ ערוסי, רו״ח","short_name":"רונית ערוסי","start_url":".","display":"standalone","background_color":"%23f1f6fd","theme_color":"%2310306e"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10306e;--ink-2:#4a6aa5;--line:#cfe0f5;--bg:#f1f6fd;--panel:#fff;
 --accent:#1592e6;--accent-d:#0d6cb4;--accent-2:#e2f1fd;--warn:#b5651d;--bad:#c0392b;--good:#0e8f8f;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
header{background:linear-gradient(105deg,#10306e 0%,#14509e 60%,#1592e6 140%);color:#fff;padding:12px 14px}
header h1{margin:0;font-size:18px;font-weight:800}
header .meta{font-size:12px;opacity:.8}
nav{display:flex;gap:6px;overflow-x:auto;padding:9px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#navUndo{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-2);
 border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
#navBack{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;box-shadow:0 1px 4px rgba(21,146,230,.35)}
main{padding:8px 16px 28px;max-width:1180px;margin:0 auto}
section[hidden]{display:none}
h2{font-size:13.5px;color:var(--ink-2);margin:14px 0 5px;font-weight:700;letter-spacing:-.2px}
h2:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px;align-items:stretch;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:100%;
 display:flex;flex-direction:column;justify-content:center;min-height:56px;line-height:1.25}
.card .k{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere;letter-spacing:-.1px}
.card .v{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.card .n{font-size:10.5px;color:var(--ink-2);overflow-wrap:anywhere;opacity:.85}
.v.good{color:var(--good)}.v.bad{color:var(--bad)}.v.warn{color:var(--warn)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);
 max-width:100%;width:100%}
table{width:100%;min-width:0;border-collapse:collapse;font-size:13px;table-layout:auto}
/* טקסט נשבר לשורה שנייה כדי שהטבלה תיכנס למסך; מספרים ותאריכים לא נשברים */
/* ככלל: שורה בגובה אחיד — תא אחד בשורה אחת, בלי התרחבות ובלי שבירת מילים */
th,td{padding:5px 5px;text-align:right;border-bottom:1px solid var(--line);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:keep-all;hyphens:none;
 vertical-align:middle}
tbody tr,thead tr,tfoot tr{height:34px}
/* עמודות טקסט ארוך נחתכות בסוף השורה; לחיצה פותחת את הטקסט המלא */
td[data-l="הערה"]{max-width:140px;color:var(--ink-2)}
td[data-l="סיבה"],td[data-l="תיאור"],td[data-l="פרטים"],td[data-l="מה ישתנה"]{max-width:132px}
td[data-l="לקוח"],td[data-l="שם"],td[data-l="משימה"],td[data-l="פירוט"]{max-width:135px}
@media (min-width:1500px){
  td[data-l="הערה"]{max-width:260px}
  td[data-l="סיבה"],td[data-l="תיאור"],td[data-l="פרטים"],td[data-l="מה ישתנה"]{max-width:230px}
  td[data-l="לקוח"],td[data-l="שם"],td[data-l="משימה"],td[data-l="פירוט"]{max-width:190px}
}
th.num,td.num,td.nw,th.nw{white-space:nowrap;overflow-wrap:normal}
/* עמודת הפעולות תמיד צמודה לקצה ונגישה ללחיצה גם אם הטבלה רחבה */
.scroll table td.act,.scroll table th.act{position:sticky;left:0;z-index:2;background:var(--panel);
 box-shadow:-6px 0 6px -6px rgba(16,48,110,.18);white-space:nowrap;padding-left:7px;padding-right:7px}
.scroll table th.act{background:var(--accent-2);z-index:3}
.scroll table tfoot td.act{background:#eaf4fe}

@media (max-width:680px){ .scroll table td.act,.scroll table th.act{box-shadow:none;position:static} }
@media print{ .scroll table td.act,.scroll table th.act{position:static;box-shadow:none} }
th{background:var(--accent-2);color:var(--accent-d);font-size:12px;font-weight:700;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:700;background:#eaf4fe;color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
label{font-size:13px;color:var(--ink-2)}
select,input,textarea{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
input[type=number]{width:96px}input[type=date]{width:150px}
button.act{background:linear-gradient(180deg,#1b9bef,#0d7fd0);color:#fff;border:none;border-radius:8px;padding:9px 15px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font:inherit;cursor:pointer}
button.mini{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:inherit;font-size:13px;cursor:pointer}
button.danger{color:var(--bad)}
.note{display:inline;white-space:nowrap;cursor:pointer;color:var(--ink)}
.note:hover{text-decoration:underline}
.note:hover{text-decoration:underline}

.flag{color:var(--bad);font-weight:600}.ok{color:var(--good)}.mute{color:var(--ink-2);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;max-width:820px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grid2 label{display:flex;flex-direction:column;gap:3px}
details>summary{cursor:pointer;color:var(--ink-2);font-size:14px;padding:5px 2px}
.plan .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:5px 9px;border-bottom:1px solid var(--line);font-size:13.5px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.plan .r:last-child{border-bottom:none}.plan .r.tot{background:#eaf4fe;font-weight:700}
.plan .r b{min-width:48px;text-align:left}.plan .r span.m{min-width:70px;text-align:left;color:var(--ink-2)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.open{background:#dff0fd;border-color:#a9d6f7;color:#0d6cb4;font-weight:600}

    else if(M("Tishri")&&day===15) out="סוכות";

    out.set(aesDec(secret,H512(cat(kdSalt,le32(i))).slice(0,16),data.slice(i*4096,(i+1)*4096)),i*4096);
  }
  const res=out.slice(0,total);
  if(!(res[0]===0x50&&res[1]===0x4b)) throw new Error("הסיסמה שגויה");
  return res;
}
const xdate=v=>{ if(v==null||v==="")return null;

function importWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});

    settings:Object.assign({},DB.settings),updated:Date.now()};
  const cl=M("לקוחות");

    let c=db.clients.find(c=>c.name===name); if(c)return c.id;
    c={id:uid(),name,type:type||""}; db.clients.push(c); return c.id;};

  const T=M("ניהול משימות");
  const hdr=(T[0]||[]).map(x=>String(x||"").trim());

    for(const x of n){const i=hdr.findIndex(h=>h.indexOf(x)===0);if(i>=0)return i;}return -1;};
  const c={name:col("שם מלא (משפחה + פרטי)","שם מלא"),year:col("שנה"),type:col("סוג"),sched:col('לו"ז',"לוז"),
    work:col("סטטוס עבודה","סטטוס"),subm:col("סטטוס הגשה","הוגש"),fee:col("שכר טרחה משרד"),
    est:col("צפי שעות"),extra:col("תוספת נטו לרונית (₪)","תוספת נטו"),notes:col("הערות"),file:col("מספר תיק")};
  const key2task={};
  for(let i=1;i<T.length;i++){
    const r=T[i]; if(!r) continue; const nm=r[c.name]; if(!nm||!String(nm).trim()) continue;
    const name=String(nm).trim();
    if(name==="כלליות") continue;
    const id=uid(), cid=addClient(name);
    const t={id,clientId:cid,year:r[c.year]||"",type:String(r[c.type]||"").trim(),
      fee:num(r[c.fee]),extra:num(r[c.extra]),est:num(r[c.est]),sched:xdate(r[c.sched]),
      work:String(r[c.work]||"").trim(),submit:String(r[c.subm]||"").trim().replace(/\s+/g," "),
      fileNo:r[c.file]||"",notes:String(r[c.notes]||"")};

    db.tasks.push(t);
    key2task[name+"|"+t.year]=key2task[name+"|"+t.year]||[];
    key2task[name+"|"+t.year].push(t);
  }
  const mapType=x=>{x=String(x||"").trim();
    return x==="דוח שנתי"?"דוח שנתי":(x==="ליווי שוטף"?"טיפול שוטף":x);};
  const byClient={};
  db.tasks.forEach(t=>{const n=db.clients.find(c=>c.id===t.clientId).name;(byClient[n]=byClient[n]||[]).push(t);});
  const pick=(name,year,type)=>{
    let list=key2task[name+"|"+year]||[];
    if(!list.length){
      const all=byClient[name]||[];
      if(!all.length) return null;
      if(all.length===1) return all[0];
      list=all.slice().sort((a,b)=>num(b.year)-num(a.year));
      return list[0];
    }
    const mt=mapType(type);
    return list.find(t=>t.type===mt||(mt==="דוח שנתי"&&t.type.indexOf("דוח שנתי")===0))||list[0];
  };
  wb.SheetNames.filter(n=>/^\d{4}-\d{2}$/.test(n)).sort().forEach(mn=>{
    const S=M(mn), cell=(r,cc)=>(S[r-1]&&S[r-1][cc-1]!=null)?S[r-1][cc-1]:null;
    for(let r=6;r<=70;r++){
      const d=cell(r,1), nm=cell(r,2), h=cell(r,6);
      if(!nm||!num(h)) continue;
      const name=String(nm).trim();
      if(name==="כלליות"){db.time.push({id:uid(),taskId:null,clientId:null,date:xdate(d)||(mn+"-01"),
        hours:num(h),desc:String(cell(r,5)||"כלליות")});continue;}
      const t=pick(name,cell(r,4),cell(r,3));
      db.time.push({id:uid(),taskId:t?t.id:null,clientId:t?t.clientId:addClient(name),
        date:xdate(d)||(mn+"-01"),hours:num(h),desc:String(cell(r,5)||"")});
    }
    for(let r=6;r<=25;r++){
      const nm=cell(r,15); if(!nm||!String(nm).trim()) continue;
      const name=String(nm).trim(), year=cell(r,16);
      const t=pick(name,year,null);
      const extraCell=num(cell(r,19));
      db.bills.push({id:uid(),month:mn,taskId:t?t.id:null,clientId:t?t.clientId:addClient(name),
        year:t?t.year:(year||""),date:xdate(cell(r,17))||(mn+"-01"),fee:num(cell(r,18)),
        extra:extraCell||(t?num(t.extra):0),amount:null,note:""});
    }
    const days=num(cell(52,25)),km=num(cell(53,25)),rate=num(cell(54,25));
    if(days||km) db.travel.push({month:mn,days,km,rate:rate||1});
  });
  db.tasks.forEach(t=>{ t.decision="לקחתי";
    const act=db.time.filter(x=>x.taskId===t.id).reduce((s,x)=>s+num(x.hours),0);
    const rem=Math.max(0,num(t.est)-act);
    if(t.submit==="לטיפול"&&t.sched&&rem>0) db.plans.push({id:uid(),taskId:t.id,date:t.sched,hours:rem});
  });
  const calc=wb.Sheets["מחשבון תיקים"], gv=a=>(calc&&calc[a]&&typeof calc[a].v==="number")?calc[a].v:null;
  const mz=wb.Sheets["מרכז"];
  db.settings.share=(mz&&mz.C3&&typeof mz.C3.v==="number")?mz.C3.v:1/3;
  db.settings.target=gv("E3")||gv("B3")||200;
  db.settings.targetNext=gv("E11")||gv("B11")||250;
  db.settings.hoursPerDay=gv("E12")||gv("B12")||7;
  db.settings.billEmail=DB.settings.billEmail||'dekel@homek.co.il';
  return db;
}

function planTitle(p){const t=taskById(p.taskId); return (t?tName(t)+" · "+(t.year||"")+" "+(t.type||""):"עבודה");}
function planTimes(p){
  const start=(p.start&&/^\d{2}:\d{2}$/.test(p.start))?p.start:"09:00";
  const [hh,mm]=start.split(":").map(Number);
  const s0=new Date(p.date+"T00:00:00"); s0.setHours(hh,mm,0,0);
  const e0=new Date(s0.getTime()+Math.max(0.25,num(p.hours))*3600000);
  const f=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes())+":00";
  return {start:f(s0),end:f(e0)};
}
/* תכנון שטרם הגיע ליומן מסומן כממתין, וייכנס בסנכרון הבא */
const gcalPending=m=>DB.plans.filter(p=>(!m||monthOf(p.date)===m)&&!p.done&&(!p.evId||p.evDirty));
/* מחפש אירוע זהה שכבר קיים ביומן, כדי לא ליצור כפילות */
async function gcalFindTwin(p){
  try{
    const t=planTimes(p);
    const from=new Date(p.date+"T00:00:00"), to=new Date(from.getTime()+86400000);
    const url="https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true"+
      "&maxResults=50&timeMin="+encodeURIComponent(from.toISOString())+
      "&timeMax="+encodeURIComponent(to.toISOString());
    const r=await gFetch(url); const j=await r.json();
    const title=planTitle(p), used=new Set(DB.plans.filter(x=>x!==p).map(x=>x.evId).filter(Boolean));
    const hit=(j.items||[]).find(ev=>ev.status!=="cancelled"&&ev.summary===title&&
      ev.start&&ev.start.dateTime&&ev.start.dateTime.slice(0,16)===t.start.slice(0,16)&&!used.has(ev.id));
    return hit?hit.id:null;
  }catch(e){ return null; }
}
async function gcalUpsert(p,quiet){
  if(!DB.settings.gcal) return {ok:false,why:"off"};
  if(!drive.token){ p.evDirty=true; drive.needsAuth=true; return {ok:false,why:"auth"}; }
  const t=planTimes(p);
  const body={summary:planTitle(p),description:"תוכנן במערכת רונית פינץ ערוסי, רו״ח",
    start:{dateTime:t.start,timeZone:"Asia/Jerusalem"},end:{dateTime:t.end,timeZone:"Asia/Jerusalem"}};
  const col=DB.settings.gcalColor;
  if(col) body.colorId=String(col);
  const base="https://www.googleapis.com/calendar/v3/calendars/primary/events";
  const send=async(id)=>{
    const r=await gFetch(id?(base+"/"+id):base,
      {method:id?"PATCH":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    return r.json();
  };
  /* תכנון שעדיין אין לו אירוע — בודקים שלא קיים כבר אירוע זהה */
  if(!p.evId){ const twin=await gcalFindTwin(p); if(twin) p.evId=twin; }
  try{
    let j;
    try{ j=await send(p.evId); }
    catch(e1){
      /* יוצרים מחדש רק כשהאירוע באמת כבר לא קיים ביומן (404/410),
         ולא בכל שגיאה — אחרת נוצרות כפילויות */
      const gone=p.evId&&/\b(404|410)\b/.test(e1.message||"");
      if(!gone) throw e1;
      const twin=await gcalFindTwin(p);     /* אולי הוא קיים תחת מזהה אחר */
      if(twin){ p.evId=twin; j=await send(twin); }
      else { p.evId=null; j=await send(null); }
    }
    if(j&&j.id){ p.evId=j.id; p.evDirty=false; saveLocal(); return {ok:true}; }
    p.evDirty=true; return {ok:false,why:"no-id"};
  }catch(e){
    p.evDirty=true;
    if(e.message==="auth"){dropTok();drive.needsAuth=true;}
    if(!quiet) toast("שליחה ליומן נכשלה: "+(e.message||"שגיאה"));
    return {ok:false,why:e.message||"err"};
  }
}

function freeStarts(k,hours,skipPlanId){
  if(!k) return [];

  for(let t=dayStartM(); t+need<=dayEndM(); t+=15)

window.gcalDedupe=async function(m){
  if(!gReady()||!drive.token){ toast("צריך קודם להתחבר לגוגל"); return; }
  const [Y,M]=m.split("-").map(Number);
  const from=new Date(Y,M-1,1), to=new Date(Y,M,1);
  try{
    const url="https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime"+
      "&maxResults=500&timeMin="+encodeURIComponent(from.toISOString())+"&timeMax="+encodeURIComponent(to.toISOString());
    const r=await gFetch(url); const j=await r.json();
    const ours=(j.items||[]).filter(ev=>ev.status!=="cancelled"&&
      (ev.description||"").indexOf("תוכנן במערכת")>=0&&ev.start&&ev.start.dateTime);
    const keep=new Set(DB.plans.map(p=>p.evId).filter(Boolean));
    const seen={}, dupes=[];
    ours.forEach(ev=>{ const k=ev.summary+"|"+ev.start.dateTime.slice(0,16);
      (seen[k]=seen[k]||[]).push(ev); });
    Object.values(seen).forEach(list=>{
      if(list.length<2) return;

      const stay=list.find(e=>keep.has(e.id))||list[0];
      list.forEach(e=>{ if(e.id!==stay.id) dupes.push(e); });
    });
    if(!dupes.length){ toast("לא נמצאו כפילויות ביומן ✓"); return; }
    if(!confirm("נמצאו "+dupes.length+" אירועים כפולים ביומן. למחוק אותם?")) return;
    let n=0;
    for(const e of dupes){
      try{ await gFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+e.id,{method:"DELETE"}); n++; }
      catch(err){}
    }
    toast("נמחקו "+n+" אירועים כפולים");
  }catch(e){ toast("הבדיקה נכשלה: "+(e.message||"שגיאה")); }
};
async function gcalSyncMonth(m){

/* ============ save reports to a folder ============ */
let repDir=null;
function idbGet(k){return new Promise(res=>{ if(!window.indexedDB) return res(null); let q; try{q=indexedDB.open("cpa-fs",1);}catch(e){return res(null);}
  q.onupgradeneeded=()=>q.result.createObjectStore("h");
  q.onsuccess=()=>{const tx=q.result.transaction("h","readonly").objectStore("h").get(k);
    tx.onsuccess=()=>res(tx.result||null); tx.onerror=()=>res(null);};
  q.onerror=()=>res(null);});}
function idbSet(k,v){return new Promise(res=>{ if(!window.indexedDB) return res(false); let q; try{q=indexedDB.open("cpa-fs",1);}catch(e){return res(false);}
  q.onupgradeneeded=()=>q.result.createObjectStore("h");
  q.onsuccess=()=>{const tx=q.result.transaction("h","readwrite").objectStore("h").put(v,k);
    tx.onsuccess=()=>res(true); tx.onerror=()=>res(false);};
  q.onerror=()=>res(false);});}
async function getReportDir(force){
  if(!window.showDirectoryPicker) return null;
  if(!force){ if(repDir) return repDir;
    let h=null; try{ h=await idbGet("dir"); }catch(e){ h=null; }
    if(h){ const perm=await h.queryPermission({mode:"readwrite"});
      if(perm==="granted"||(await h.requestPermission({mode:"readwrite"}))==="granted"){repDir=h;return h;} } }
  const h=await window.showDirectoryPicker({mode:"readwrite",id:"cpaReports",startIn:"documents"});
  repDir=h; try{ await idbSet("dir",h); }catch(e){}
  try{localStorage.setItem("cpa-repdir-name",h.name||"");}catch(e){}
  return h;
}

function repStamp(){const d=new Date();return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear();}
window.printReport=function(){
  const r=S.rep||"open", name=(typeof REPNAMES!=="undefined"&&REPNAMES[r])||"דוח";
  const orig=document.title;
  document.title="רונית ערוסי - "+name+" "+repStamp();
  const restore=()=>{document.title=orig;window.removeEventListener("afterprint",restore);};
  window.addEventListener("afterprint",restore);
  window.print();
  setTimeout(restore,3000);
};
function downloadReport(html,fname,msg){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
  a.download=fname; a.click();
  toast(msg||"הקובץ ירד לתיקיית ההורדות");
}
async function writeInto(dir,name,fname,html){
  let target=dir;
  try{ target=await dir.getDirectoryHandle(name,{create:true}); }
  catch(e){ target=dir; fname=name+" - "+fname; }
  const fh=await target.getFileHandle(fname,{create:true});
  const ws=await fh.createWritable();
  await ws.write(html); await ws.close();
  return (target===dir?"":name+"/")+fname;
}
async function saveReportToFolder(){
  const r=S.rep||"open", name=(typeof REPNAMES!=="undefined"&&REPNAMES[r])||"דוח";
  const sec=$("#s-reports"); if(!sec) return;
  const clone=sec.cloneNode(true);
  clone.querySelectorAll(".noprint").forEach(e=>e.remove());
  const html=reportHtml(name,clone.innerHTML);
  const d=new Date();
  const stamp=d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  const fname=`${name} ${stamp}.html`;
  if(!window.showDirectoryPicker){
    downloadReport(html,fname,"הדפדפן לא תומך בשמירה לתיקייה — הקובץ ירד לתיקיית ההורדות");
    return;}
  const attempt=async(force)=>{
    const dir=await getReportDir(force);
    if(!dir) throw new Error("no-dir");
    return await writeInto(dir,name,fname,html);
  };
  try{
    const where=await attempt(false);
    toast("נשמר: "+where);
  }catch(e1){
    if(e1&&e1.name==="AbortError"){toast("בוטל");return;}
    try{
      repDir=null; try{ await idbSet("dir",null); }catch(e){}
      const where=await attempt(true);
      toast("נשמר: "+where);
    }catch(e2){
      if(e2&&e2.name==="AbortError"){toast("בוטל");return;}
      downloadReport(html,fname,"לא ניתן לכתוב לתיקייה שנבחרה — הקובץ ירד לתיקיית ההורדות");
    }
  }
}

function docNo(m){ return String(m||"").replace("-","")+"-01"; }
function payDoc(m,clientId,detail,sel){
  const S0=DB.settings, B=S0.bank||{};
  const cObj=clientId?DB.clients.find(c=>c.id===clientId):null;
  const isPriv=cObj?srcOf(clientId)==="private":false;
  const toName=isPriv?cObj.name:(S0.payTo||"");
  const toLines=isPriv
    ? [cObj.taxId?((cObj.type||"").indexOf("חברה")>=0?"ח.פ ":"ת.ז ")+cObj.taxId:"",cObj.addr||""].filter(Boolean)
    : [];
  let bills=DB.bills.filter(b=>b.month===m);
  if(clientId) bills=bills.filter(b=>(b.clientId||((b.taskId&&taskById(b.taskId))||{}).clientId)===clientId);
  if(sel) bills=bills.filter(b=>sel[b.id]!==false);
  const lines=[];
  bills.forEach(b=>{
    const cid=b.clientId||((b.taskId&&taskById(b.taskId))||{}).clientId;
    const t=b.taskId?taskById(b.taskId):null;
    const vr=vatRate(b);
    const hrs=b.taskId?taskHours(b.taskId):billHours(b);
    billComp(b).forEach((c,ci)=>lines.push({who:cid?clientName(cid):"—",
      what:(t?(t.type+" "+(t.year||"")):(b.year||""))+" · "+c.label,
      hours:ci===0?hrs:0, showH:ci===0&&hrs>0,
      amount:c.amount,vat:c.vat&&vr>0,rate:vr}));
  });
  const trav=(clientId||isPriv)?0:monthTravel(m);
  if(trav>0) lines.push({who:"—",what:"החזר נסיעות",hours:0,showH:false,
    amount:r2(trav),vat:true,rate:num(S0.vat)});
  expList(m).filter(e=>!clientId||e.clientId===clientId).forEach(e=>{
    if(sel&&sel["ex:"+e.id]===false) return;
    lines.push({who:e.clientId?clientName(e.clientId):"—",
      what:"החזר הוצאות · "+(e.kind||"אחר")+(e.desc?" — "+e.desc:""),
      hours:0,showH:false,amount:r2(num(e.amount)),vat:e.vat!==false,rate:num(S0.vat)});});
  const net=r2(lines.reduce((s,x)=>s+x.amount,0));
  const totH=Math.round(lines.reduce((s,x)=>s+num(x.hours),0)*10)/10;
  const vat=r2(lines.reduce((s,x)=>s+(x.vat?x.amount*num(x.rate)/100:0),0));
  const tot=r2(net+vat);
  const d=new Date(), due=new Date(d.getTime()+num(S0.payDays||10)*86400000);
  const heMonth=(()=>{const [Y,M]=String(m).split("-");
    return ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"][+M-1]+" "+Y;})();
  let body;
  if(detail===false){
    body=`<table class="pd-tbl"><thead><tr><th>פירוט</th>${totH>0?'<th class="c">שעות בפועל</th>':""}
      <th class="n">סכום ₪</th></tr></thead><tbody>
      <tr><td>שירותי ראיית חשבון — ${esc(heMonth)}${clientId?" · "+esc(clientName(clientId)):""}</td>
        ${totH>0?`<td class="c">${f1(totH)}</td>`:""}<td class="n">${f0(net)}</td></tr></tbody></table>`;
  } else {
    /* עמודת מע"מ מוצגת רק כשיש ערבוב — אם הכול חייב או הכול פטור, היא מיותרת */
    const mixed=lines.some(x=>x.vat)&&lines.some(x=>!x.vat);
    const row=x=>`<tr><td>${esc(x.who)}</td><td>${esc(x.what)}</td>
      <td class="c">${x.showH?f1(x.hours):""}</td>
      <td class="n">${f0(x.amount)}</td>${mixed?`<td class="c">${x.vat?"כן":"לא"}</td>`:""}</tr>`;
    body=`<table class="pd-tbl"><thead><tr><th>לקוח</th><th>פירוט</th><th class="c">שעות בפועל</th>
      <th class="n">סכום ₪</th>${mixed?'<th class="c">מע"מ</th>':""}</tr></thead>
      <tbody>${lines.length?lines.map(row).join(""):'<tr><td colspan="5">אין שורות לתקופה זו</td></tr>'}</tbody>
      ${totH>0?`<tfoot><tr><td colspan="2">סה"כ</td><td class="c"><b>${f1(totH)}</b></td>
        <td class="n"><b>${f0(net)}</b></td>${mixed?"<td></td>":""}</tr></tfoot>`:""}</table>`;
  }
  return `<div class="paydoc">
    <div class="pd-top">
      <div class="pd-biz">
        <div class="pd-name"><span class="ed" id="edName" contenteditable="true"
          data-k="bizName" title="לחיצה לעריכה">${esc(S0.bizName||"רונית פינץ ערוסי, רו״ח")}</span></div>
        <div class="pd-sub">${[S0.bizId?"ע.מ "+esc(S0.bizId):"",esc(S0.bizAddr||""),
          esc(S0.bizPhone||""),esc(S0.bizMail||"")].filter(Boolean).join(" · ")}</div>
      </div>
      <div class="pd-meta">
        <div class="pd-title">דרישת תשלום</div>
        <div class="pd-kind">${isPriv?"לקוח פרטי":"משרד הורוביץ"}</div>
        <div>מס׳ ${esc(docNo(m))}</div>
        <div>תאריך ${d.toLocaleDateString("he-IL")}</div>
      </div>
    </div>
    <div class="pd-to"><b>לכבוד:</b> ${isPriv
        ? `<b>${esc(toName)}</b>`+(toLines.length?`<br><span class="mute">${toLines.map(esc).join(" · ")}</span>`:"")
        : `<span class="ed" id="edTo" contenteditable="true" data-k="payTo" title="לחיצה לעריכה">${esc(S0.payTo||"— שם המשרד —")}</span>`}<br>
      <b>בגין:</b> שירותי ראיית חשבון — ${esc(heMonth)}${clientId?" · "+esc(clientName(clientId)):""}</div>
    ${body}
    <div class="pd-sum">
      <div><span>סה"כ לפני מע"מ</span><b>${f0(net)} ₪</b></div>
      ${vat>0?`<div><span>מע"מ ${f1(num(S0.vat))}%</span><b>${f0(vat)} ₪</b></div>`:""}
      <div class="big"><span>סה"כ לתשלום</span><b>${f0(tot)} ₪</b></div>
    </div>
    <div class="pd-pay">
      <b>פרטי תשלום — העברה בנקאית</b>
      <div>בנק ${esc(B.name||"")} (${esc(B.bank||"")}) · סניף ${esc(B.branch||"")} · חשבון ${esc(B.acc||"")}</div>
      <div>על שם: ${esc(B.owner||"")}</div>
    </div>
    <div class="pd-terms">
      יש לשלם תוך ${num(S0.payDays||10)} ימים, עד ${due.toLocaleDateString("he-IL")}.<br>
      חשבונית מס תישלח לאחר קבלת התשלום.
    </div>
    <div class="pd-sign">בכבוד רב,<br><b>רונית פינץ ערוסי, רו״ח</b></div>
  </div>`;
}

function card(k,v,n,cls,drill){
  return `<div class="card" ${drill?`style="cursor:pointer" onclick="drill('${drill}')"`:""}>
    <div class="k">${k}${drill?' <span class="mute">›</span>':""}</div>
    <div class="v ${cls||""}">${v}</div>${n?`<div class="n">${n}</div>`:""}</div>`;}
const NUMCELL=/^[-+]?[\d,.]+\s*(₪|%|ש׳|שעות)?$/;
function table(head,rows,foot,keep){
  const plain=c=>String(c==null?"":c).replace(/<[^>]*>/g,"").replace(/&nbsp;/g," ").trim();
  /* עמודת פעולות = העמודה האחרונה כשיש בה לחצנים */
  const lastI=head.length-1;
  const actCol=rows.length>0&&rows.every(r=>/<button|<input|<select/.test(String(r[lastI]==null?"":r[lastI])))
    ||/^(טיפול|פעולות)?$/.test(String(head[lastI]==null?"":head[lastI]).trim())&&rows.some(r=>/<button/.test(String(r[lastI]||"")));
  const numCol=head.map((h,i)=>{
    const vals=rows.map(r=>plain(r[i])).filter(v=>v!==""&&v!=="—");
    return vals.length>0&&vals.every(v=>NUMCELL.test(v));});
  /* עמודה שכל ערכיה קצרים לא נשברת כלל */
  const nwCol=head.map((h,i)=>{
    if(numCol[i]) return false;
    const vals=rows.map(r=>plain(r[i]));
    const longest=vals.reduce((a,v)=>Math.max(a,v.length),0);
    const word=vals.reduce((a,v)=>Math.max(a,...v.split(/\s+/).map(x=>x.length)),0);
    return longest<=16||word<=8;});
  const cls=(i,extra)=>{const c=[];
    if(keep&&keep.length&&keep.indexOf(i)<0) c.push("m-hide");
    if(numCol[i]) c.push("num");
    else if(nwCol[i]) c.push("nw");
    if(actCol&&i===lastI) c.push("act");
    if(extra) c.push(extra);
    return c.length?' class="'+c.join(" ")+'"':'';};
  const td=(c,i)=>{const t=plain(c);
    const tip=(t.length>18&&!/<button|<input|<select/.test(String(c==null?"":c)))
      ?` title="${t.replace(/"/g,"&quot;")}"`:"";
    return `<td${cls(i)}${tip} data-l="${String(head[i]==null?"":head[i]).replace(/"/g,"&quot;")}">${c==null?"":c}</td>`;};
  return `<div class="scroll"><table><thead><tr>${head.map((h,i)=>
    `<th${cls(i)} data-l="${String(h==null?"":h).replace(/"/g,"&quot;")}">${h}</th>`).join("")}</tr></thead>
   <tbody>${rows.length?rows.map(r=>`<tr>${r.map(td).join("")}</tr>`).join("")
   :`<tr><td colspan="${head.length}" class="mute">אין נתונים</td></tr>`}</tbody>
   ${foot?`<tfoot><tr>${foot.map(td).join("")}</tr></tfoot>`:""}</table></div>`;}

      ["שכ\"ט שטרם נדרש",f0(notB)+" ₪"],["שעות שנותרו במשימות פתוחות",f1(rem)],
      ["₪ לשעה כולל צפי",f0((base+rem)>0?(billed+notB)/(base+rem):0)]]));
  }
  if(k==="due"){
    /* טרם נדרש משויך לחודש לפי יעד ההגשה של המשימה */
    const unb=mine.filter(t=>!billedTask(t.id));
    const pend={}; let pendNoDate=0;
    unb.forEach(t=>{const m=t.sched?monthOf(t.sched):"";
      if(m) pend[m]=(pend[m]||0)+taskMine(t); else pendNoDate+=taskMine(t);});
    const ms=[...new Set([...monthsList(),...Object.keys(pend)])].sort();
    const rows=ms.map(m=>{const x=monthSummary(m), p=pend[m]||0;
      return [m,f0(x.fee),f0(x.extra),f0(x.byRate),f0(x.mine),f0(x.paid),f0(x.mine-x.paid),
        p?f0(p):"",f0(x.mine+p)];});
    if(pendNoDate>0) rows.push(["ללא יעד הגשה","","","","","","",f0(pendNoDate),f0(pendNoDate)]);

      rows,
      ["סה\"כ",f0(S2(x=>x.fee)),f0(S2(x=>x.extra)),f0(S2(x=>x.byRate)),f0(totDem),

         הן מופיעות במסך דרישות התשלום ובדוח דרישת תשלום.</div>`);
  }
  if(k==="notbilled"){
    const list=mine.filter(t=>!billedTask(t.id));
    return box("טרם דרשתי — פירוט",table(H,list.map(row),
      ["סה\"כ","","","",f0(list.reduce((s,t)=>s+num(t.fee),0)),"",f0(list.reduce((s,t)=>s+taskMine(t),0)),"","","",""]));
  }
  if(k==="open") return box("משימות פתוחות",table(H,open.map(row),null));
  if(k==="review") return box("משימות בבדיקה",table(H,DB.tasks.filter(t=>t.decision==="בבדיקה").map(row),null));
  if(k==="free"){
    const t0=today(), eom=new Date(t0.getFullYear(),t0.getMonth()+1,0);
    const days=[]; const d=new Date(t0);
    while(d<=eom){const kk=iso(d),inf=dayInfo(d);

  }
  return "";
}

function viewCal(){
  const cur=S.calMonth||iso(today()).slice(0,7);
  const [Y,M]=cur.split("-").map(Number);
  const first=new Date(Y,M-1,1), lastD=new Date(Y,M,0).getDate();
  const cells=[]; const lead=first.getDay();
  for(let i=0;i<lead;i++) cells.push(null);
  for(let d=1;d<=lastD;d++) cells.push(new Date(Y,M-1,d));
  const monthPlans=DB.plans.filter(p=>monthOf(p.date)===cur);
  const planned=monthPlans.reduce((s,p)=>s+num(p.hours),0);
  const plannedOpen=monthPlans.filter(p=>!p.done).reduce((s,p)=>s+num(p.hours),0);
  const nDone=monthPlans.filter(p=>p.done).length;
  const actual=DB.time.filter(t=>monthOf(t.date)===cur).reduce((s,t)=>s+num(t.hours),0);
  const cap=businessDays(first,new Date(Y,M-1,lastD))*DB.settings.hoursPerDay;
  const busyM=(DB.busy||[]).filter(b=>monthOf(b.date)===cur).reduce((s,b)=>s+num(b.hours),0);
  const months=[...new Set([...monthsList(),cur])].sort();
  const cell=dt=>{
    if(!dt) return `<div></div>`;
    const k=iso(dt), inf=dayInfo(dt), ph=planHours(k), ah=actualOn(k);
    const vac=DB.offDays.includes(k), off=isOfficeDay(k);
    const dayPlans=DB.plans.filter(p=>p.date===k);
    const chips=`<div class="chips">`+dayPlans.map(p=>{const t=taskById(p.taskId);
      const pv=t&&taskSrc(t)==="private";
      return `<div class="c${p.done?" fin":""}${pv?" priv":""}" title="${esc(t?taskLabel(t):"")}${pv?" — לקוח פרטי":""}${p.done?" — בוצע":""}">${
        p.done?"✓ ":""}${pv?"◆ ":""}${esc(t?tName(t):"—")} ${f1(p.hours)}</div>`;}).join("")
      +busyOn(k).map(b=>`<div class="c busy" title="פרטי מיומן גוגל ${esc(b.start||"")}">פרטי ${f1(b.hours)}</div>`).join("")
      +(ah?`<div class="c done">בפועל ${f1(ah)}</div>`:"")+`</div>`;
    return `<div class="d ${vac?"vac":(inf.off?"off":"")} ${k===iso(today())?"today":""} ${k===S.calDay?"sel":""}" onclick="pickDay('${k}')">
      <div class="n">${dt.getDate()}${off?' <span class="t">🏢</span>':""}${inf.label?` <span class="t">${vac?"חופשה":inf.label}</span>`:""}</div>
      ${ph?`<div class="t plan">מתוכנן ${f1(ph)}</div>`:""}${chips}</div>`;
  };
  const sel=S.calDay&&monthOf(S.calDay)===cur?S.calDay:null;
  return `${printBtn()}${printHead("לוח חודשי")}<h2>לוח חודשי</h2>
  <div class="row noprint">
    <label>חודש <select id="calM">${opts(months,cur)}</select></label>
    <button class="ghost" id="calPrev">‹ הקודם</button><button class="ghost" id="calNext">הבא ›</button>
    <button class="${gcalPending(cur).length?"act":"ghost"}" id="calGsync">📅 שליחת התכנון ליומן גוגל</button>
    <button class="ghost" id="calGpull">⬇ משיכת משבצות תפוסות מהיומן</button>
    <button class="ghost" onclick="gcalDedupe('${cur}')">🧹 ניקוי כפילויות ביומן</button>
    ${(()=>{const n=gcalPending(cur).length;
      if(!DB.settings.gcal) return `<span class="mute">סנכרון היומן כבוי — לחיצה על השליחה תפעיל אותו</span>`;
      return n?`<span class="flag">${n} משבצות טרם נשלחו ליומן</span>`
              :`<span class="ok">כל התכנון ביומן ✓</span>`;})()}
  </div>
  <div class="cards">
    ${card("מתוכנן החודש",`<span style="color:#0d6cb4">${f1(planned)}</span>`,
      nDone?"שעות · "+nDone+" סומנו בוצע":"שעות")}
    ${card("בוצע בפועל",`<span style="color:#31409b">${f1(actual)}</span>`,"שעות")}
    ${card("פרטי מהיומן",`<span style="color:#5c6875">${f1(busyM)}</span>`,"שעות · ללא שישי/שבת")}
    ${card("קיבולת",f1(cap),businessDays(first,new Date(Y,M-1,lastD))+" ימי עסקים")}
    ${card("פנוי",f1(cap-plannedOpen-busyM-actual),"בניכוי מתוכנן, בפועל ופרטי",
      cap-plannedOpen-busyM-actual<0?"bad":"")}
  </div>
  <div class="legend noprint">
    <span><i style="background:#dff0fd;border:1px solid #a9d6f7"></i>מתוכנן</span>
    <span><i style="background:#e2e7fb;border:1px solid #bcc6f0"></i>בוצע בפועל</span>

    <span><i style="background:#eef1f4;border:1px solid #d3dae1"></i>פרטי (מיומן גוגל)</span>
    <span><i style="background:#f0ebf8;border:1px solid #d9cfec"></i>חופשה</span>
    <span>🏢 יום משרד</span>

  </div>
  <div class="cal" style="margin-top:4px">
    ${["א","ב","ג","ד","ה","ו","ש"].map(d=>`<div class="h">${d}</div>`).join("")}
    ${cells.map(cell).join("")}
  </div>
  <div id="dayPanel">${sel?dayPanel(sel):""}</div>
`;
}

      const byClient={}; list.forEach(b=>{const n=clientName(b.clientId||((b.taskId&&taskById(b.taskId))||{}).clientId);

        ${card("שורות",list.length,"")}</div>
      ${table(["חודש","לקוח","שנה","סכום","שולם","יתרה","מצב","תאריך תשלום","אופן","אסמכתא",""],rows,
        ["סה\"כ","","",f0(sumA),f0(sumP),f0(sumA-sumP),"","","","",""],[1,3,5,6,10])}
      <h2>יתרות לפי לקוח</h2>
      ${table(["לקוח","יתרה"],Object.entries(byClient).filter(([,v])=>Math.abs(v)>0.01)
        .sort((a,b)=>b[1]-a[1]).map(([n,v])=>[n,f0(v)]))}`;
    }
    const cid=S.dc||"", yr=S.dy||"";
    const sel=DB.tasks.filter(t=>(!cid||t.clientId===cid)&&(!yr||String(t.year)===String(yr)));
    const years=[...new Set(DB.tasks.map(t=>t.year).filter(Boolean))].sort();
    const act=sel.reduce((s,t)=>s+taskHours(t.id),0), est=sel.reduce((s,t)=>s+num(t.est),0);
    const mine=sel.reduce((s,t)=>s+taskMine(t),0);
    return `<h2>לפי לקוח ושנה</h2>
      <div class="row noprint"><label>לקוח<select id="dc"><option value="">הכול</option>${clientOpts(cid)}</select></label>

      table(["לקוח","שנה","סוג","הגשה","צפי","בפועל","שכ\"ט","שלך","₪ לשעה","תשלום"],

          f0(t.fee),f0(taskMine(t)),taskHours(t.id)>0?f0(taskMine(t)/taskHours(t.id)):"",
          t.noBill?'לא לגבייה':(billedTask(t.id)?'<span class="ok">נדרש ✓</span>':(t.submit==="לטיפול"?"":'<span class="flag">טרם נדרש</span>'))]));
  };

  ${body()}`;

function viewClients(){

function exportXlsx(){
  const wb=XLSX.utils.book_new();
  wb.Workbook=wb.Workbook||{}; wb.Workbook.Views=[{RTL:true}];   /* כל החוברת מימין לשמאל */
  const add=(name,rows)=>{
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!views"]=[{RTL:true}];                 /* גיליון מימין לשמאל */
    const head=rows[0]||[];
    ws["!cols"]=head.map((h,i)=>{
      let w=String(h==null?"":h).length;
      rows.forEach(r=>{const v=r[i]; const L=String(v==null?"":v).length; if(L>w) w=L;});
      return {wch:Math.min(Math.max(w+2,8),45)};});
    ws["!freeze"]={xSplit:"0",ySplit:"1",topLeftCell:"A2",activePane:"bottomLeft",state:"frozen"};
    XLSX.utils.book_append_sheet(wb,ws,name);};
  add("תיקים",[["לקוח","החלטה","שנה","סוג","סטטוס עבודה","סטטוס הגשה","לו\"ז","שכ\"ט משרד","תוספת נטו","חלקי","צפי שעות","שעות בפועל","שעות שנותרו","נדרש תשלום"],
    ...DB.tasks.map(t=>[tName(t),t.decision||"לקחתי",t.year,t.type,t.work,t.submit,t.sched||"",
      num(t.fee),num(t.extra),mineEff(t),num(t.est),taskHours(t.id),taskRemaining(t),
      t.noBill?"לא לגבייה":(billedTask(t.id)?"כן":"לא")])]);
  add("שעות",[["תאריך","לקוח","שנה","סוג","מקום","תיאור","שעות"],
    ...DB.time.map(x=>{const t=x.taskId?taskById(x.taskId):null;
      return [x.date,t?tName(t):"כלליות",t?t.year:"",t?t.type:"",x.office?"משרד":"בית",
        x.desc||"",num(x.hours)];})]);
  add("דרישות תשלום",[["חודש","לקוח","שנה","תאריך","שכ\"ט משרד","תוספת","לפי שעות","שכ\"ט מלא",
      "שעות בפועל","לפני מע\"מ","מע\"מ","סה\"כ לתשלום","שולם","יתרה","מצב","הערה"],
    ...DB.bills.map(b=>{const t=b.taskId?taskById(b.taskId):null;
      const cid=b.clientId||(t&&t.clientId);
      return [b.month,cid?clientName(cid):(t?tName(t):""),b.year,b.date,
        b.use?(b.use.share?num(b.fee):0):num(b.fee),billPart(b,"extra"),billPart(b,"rate"),billPart(b,"other"),
        b.use&&!b.use.rate?0:billHours(b),
        billAmount(b),billVat(b),billTotal(b),billPaid(b),billDue(b),billStatus(b),b.note||""];})]);
  add("סיכום חודשי",[["חודש","שעות","כלליות","ימי משרד","נדרש","טרם נדרש","חלקי","מע\"מ","נסיעות","לגבייה"],
    ...(()=>{const mine2=takenTasks().filter(t=>!billedTask(t.id));
      const pend={}; mine2.forEach(t=>{const mm=t.sched?monthOf(t.sched):"";
        if(mm) pend[mm]=(pend[mm]||0)+taskMine(t);});
      const ms=[...new Set([...monthsList(),...Object.keys(pend)])].sort();
      return ms.map(m=>{const x=monthSummary(m), p=pend[m]||0;
        return [m,x.hours,x.gen,officeDays(m),x.mine,p,x.mine+p,x.vat,x.travel,x.due];});})()]);
  add("בדיקות כדאיות",[["שם","שנה","מוצר","החלטה","סיבה","שכ\"ט משרד","צפי שעות דקל","הערה"],
    ...DB.tasks.filter(t=>t.decision==="בבדיקה"||t.decision==="לא לקחתי"||t.checkedAt)
      .map(t=>[tName(t),t.year,t.type,t.decision||"",t.checkNote||"",num(t.fee),num(t.dekelEst),t.notes||""])]);
  XLSX.writeFile(wb,"דוחות-"+iso(today())+".xlsx");
}

  if(!confirm((on?"להחיל מע\"מ "+num(DB.settings.vat)+"% על ":"לבטל מע\"מ מ־")+list.length+
    " דרישות בחודש "+m+"?")) return;
  snapTake(on?"לפני החלת מע\"מ":"לפני ביטול מע\"מ");
  list.forEach(b=>{
    if(!b.use) b.use={share:!(b.amount!=null&&b.amount!==""),rate:num(b.rate)>0&&billHours(b)>0,
      extra:num(b.extra)>0,other:!!(b.amount!=null&&b.amount!=="")};
    if(b.other==null&&b.amount!=null&&b.amount!=="") b.other=num(b.amount);
    b.amount=null;
    b.vat={share:on,rate:on,extra:on,other:on};
    b.vatRate=on?num(DB.settings.vat):0;
  });
  saveLocal(); renderAll(); showTab(S.tab||"bills");
  toast(on?"הוחל מע\"מ על "+list.length+" דרישות":"בוטל המע\"מ");

    if(!nw||nw.length<4){msg.innerHTML='<span class="flag">סיסמה של 4 תווים לפחות</span>';return;}
    if(nw!==nw2){msg.innerHTML='<span class="flag">האימות לא תואם</span>';return;}
    const salt=uid()+uid(); const key=deriveKey(nw,salt);
    localStorage.setItem(LKEY,JSON.stringify({salt,check:b64e(key)}));
    SKEY=key; saveLocal(); sessionStorage.setItem("cpa-unlocked","1"); renderAll(); showTab("data");
    toast("הסיסמה נקבעה");};
  if(el("pwOff")) el("pwOff").onclick=()=>{
    const cfg=lockCfg(), old=($("#pwOld")||{}).value||"";
    if(!cfg) return;
    if(b64e(deriveKey(old,cfg.salt))!==cfg.check){$("#pwMsg").innerHTML='<span class="flag">הסיסמה הנוכחית שגויה</span>';return;}
    localStorage.removeItem(LKEY); SKEY=null; saveLocal(); renderAll(); showTab("data"); toast("הסיסמה בוטלה");};
  if(el("sSave")) el("sSave").onclick=()=>{
    DB.settings.share=+$("#sShare").value||1/3;DB.settings.target=+$("#sTarget").value||200;
    DB.settings.targetNext=+$("#sNext").value||250;
    DB.settings.targetPrivate=+$("#sTargetP").value||(+$("#sTarget").value||200);DB.settings.hoursPerDay=+$("#sHpd").value||7;
    DB.settings.dayStart=$("#sDs").value||"08:00";DB.settings.dayEnd=$("#sDe").value||"19:00";
    DB.settings.kmRate=+$("#sKm").value||1;DB.settings.billEmail=$("#sMail").value.trim();DB.settings.inclGeneral=$("#sGen").value==="yes";
    DB.settings.gcal=$("#sGcal").value==="yes";
    const oldCol=String(DB.settings.gcalColor==null?"":DB.settings.gcalColor);
    DB.settings.gcalColor=$("#sGcol").value;
    if(String(DB.settings.gcalColor)!==oldCol) DB.plans.forEach(p=>{if(p.evId)p.evDirty=true;});
    saveLocal();renderAll();
    toast(String(DB.settings.gcalColor)!==oldCol
      ?"ההגדרות נשמרו — ללוח החודשי ולחיצה על שליחה ליומן כדי להחיל את הצבע"
      :"ההגדרות נשמרו");};
  if(el("jsonOut")) el("jsonOut").onclick=()=>bkDownload();
  if(el("jsonIn")) el("jsonIn").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    if(!confirm("טעינת הגיבוי תחליף את כל הנתונים במכשיר הזה. להמשיך?")){e.target.value="";return;}
    try{ const j=JSON.parse(await f.text());
      if(!j||!Array.isArray(j.tasks)) throw new Error("קובץ לא מתאים");
      DB=Object.assign(DB,j); DB.plans=DB.plans||[]; DB.offDays=DB.offDays||[]; DB.officeDates=DB.officeDates||[];
      migrate(); saveLocal(); renderAll(); showTab("status");
      toast("הגיבוי נטען: "+DB.tasks.length+" משימות");
    }catch(err){ toast("שגיאה: "+(err.message||"קובץ לא תקין")); }
    e.target.value="";};
  if(el("impGo")) el("impGo").onclick=async()=>{
    const f=$("#impFile").files[0], pw=$("#impPw").value, msg=$("#impMsg");
    if(!f){msg.textContent="צריך לבחור קובץ";return;}
    if(!confirm("הייבוא מוחק את הנתונים הקיימים במערכת. להמשיך?"))return;
    msg.textContent="קורא…";
    try{
      const buf=await f.arrayBuffer(); const head=new Uint8Array(buf.slice(0,2));
      let data=new Uint8Array(buf);
      if(!(head[0]===0x50&&head[1]===0x4b)){
        if(!pw){msg.innerHTML='<span class="flag">הקובץ מוגן בסיסמה</span>';return;}
        msg.textContent="מפענח…"; data=await decryptXlsx(buf,pw,()=>{});
      }
      const db=importWorkbook(data);
      if(!db.tasks.length){msg.innerHTML='<span class="flag">לא נמצאו תיקים. אם הקובץ נשמר בלי ערכים מחושבים — לפתוח באקסל, לשמור ולנסות שוב.</span>';return;}
      DB=db; migrate(); saveLocal(); renderAll();
      msg.innerHTML=`<span class="ok">יובאו ${db.clients.length} לקוחות, ${db.tasks.length} תיקים, ${db.time.length} רישומי שעות, ${db.bills.length} שורות דרישת תשלום.</span>`;
    }catch(e){msg.innerHTML='<span class="flag">'+esc(e.message||"שגיאה")+"</span>";}
  };
}
let tickTimer=null;
function startTick(){
  if(tickTimer) clearInterval(tickTimer);
  tickTimer=setInterval(()=>{
    const el2=document.getElementById("timerVal");
    if(el2&&DB.timer&&DB.timer.running) el2.textContent=fmtDur(timerElapsedMs());
  },1000);
}
function setHdr(){
  try{document.body.classList.toggle("src-private",S.src==="private");}catch(e){}
  const st=dState();
  const sync=drive.needsAuth?"לא מחובר לגוגל — לחצי כאן להתחברות"
    :(st.synced?("מסונכרן "+new Date(st.synced).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})):"לא מסונכרן");
  const h=$("#hdr");
  h.textContent="גרסה "+VER+(S.src?" · "+srcLabel(S.src):"")+" · "+sync+
    (st.saved?" · נשמר "+new Date(st.saved).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"");
  h.style.cursor=drive.needsAuth?"pointer":"default";
  h.style.textDecoration=drive.needsAuth?"underline":"none";
  h.onclick=drive.needsAuth?(()=>{ drive.silentTried=false;
    gAuth(ok=>{ if(ok){ renderAll(); setHdr(); driveSync(true); } },false); }):null;
}
const VER="3.96.0";
function renderAll(){ try{ renderAllInner(); }catch(e){
  $("#s-status").innerHTML='<div class="panel"><b class="flag">שגיאה בתצוגה</b><div class="mute">'+esc(e.message)+'</div><pre style="white-space:pre-wrap;font-size:11px">'+esc((e.stack||"").slice(0,600))+'</pre></div>';
  showTab("status"); } }
function renderAllInner(){
  $("#s-status").innerHTML=viewStatus();
  $("#s-tasks").innerHTML=viewTasks();
  $("#s-cal").innerHTML=viewCal();
  $("#s-time").innerHTML=viewTime();
  $("#s-bills").innerHTML=viewBills();
  $("#s-reports").innerHTML=viewReports();
  $("#s-clients").innerHTML=viewClients();
  $("#s-data").innerHTML=viewData();
  wire(); setHdr(); startTick(); showTab(S.tab);
}
function showTab(n,fromPop){
  if(S.clean&&n!=="reports"){ S.clean=false; try{document.body.classList.remove("clean");}catch(e){} }
  const changed=S.tab!==n;
  S.tab=n;
  if(changed&&!fromPop){ try{history.pushState({tab:n},"");}catch(e){} }
  $$("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===n));
  ["status","tasks","cal","time","bills","reports","clients","data"].forEach(x=>{$("#s-"+x).hidden=(x!==n);});
}
$$("#tabs button[data-t]").forEach(b=>b.onclick=()=>showTab(b.dataset.t));
$("#navBack").onclick=()=>{ try{history.back();}catch(e){} };
$("#navUndo").onclick=()=>undoLast();
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(e.key==="z"||e.key==="Z")){
    const t=e.target&&e.target.tagName;
    if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT"||(e.target&&e.target.isContentEditable)) return;
    e.preventDefault(); undoLast(); }});
window.addEventListener("popstate",e=>{ if(e.state&&e.state.tab) showTab(e.state.tab,true); });
function boot(){
  try{history.replaceState({tab:S.tab},"");}catch(e){}
  const ok=loadLocal();
  if(!ok){ showLock(); return; }
  prevJSON=JSON.stringify(DB); UNDO=[]; setUndo();
  if(!DB.tasks.length&&!DB.clients.length) S.tab="data";
  renderAll();
  if(drive.token) setTimeout(()=>driveSync(false),800); else { drive.needsAuth=true; setHdr(); }
  window.addEventListener("focus",()=>{ if(drive.token&&Date.now()-lastSync>60000) driveSync(false); });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&drive.token&&Date.now()-lastSync>60000) driveSync(false); });
  setInterval(()=>{ if(drive.token) driveSync(false); },180000);
}
function showLock(msg){
  const box=$("#lock"); box.style.display="flex";
  if(msg) $("#lockMsg").innerHTML='<span class="flag">'+msg+'</span>';
  setTimeout(()=>{const i=$("#lockPw"); i&&i.focus&&i.focus();},50);
}
function tryUnlock(){
  const cfg=lockCfg(); if(!cfg) return;
  const pw=$("#lockPw").value||"";
  const key=deriveKey(pw,cfg.salt);
  if(b64e(key)!==cfg.check){ $("#lockMsg").innerHTML='<span class="flag">סיסמה שגויה</span>'; return; }
  SKEY=key; sessionStorage.setItem("cpa-unlocked","1");
  $("#lock").style.display="none"; $("#lockPw").value="";
  boot();
}
$("#lockGo").onclick=tryUnlock;
$("#lockPw").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock();});
$("#lockReset").onclick=()=>{
  if(!confirm("איפוס ימחק את הנתונים השמורים במחשב הזה. אם יש גיבוי בדרייב אפשר לטעון אותו אחרי הכניסה. להמשיך?"))return;
  localStorage.removeItem(LS); localStorage.removeItem(LKEY); sessionStorage.removeItem("cpa-unlocked");
  location.reload();};
if(lockCfg()) showLock(); else boot();
</script>
