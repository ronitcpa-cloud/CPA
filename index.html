<link rel="manifest" href='data:application/manifest+json,{"name":"רונית פינץ ערוסי, רו״ח","short_name":"רונית ערוסי","start_url":".","display":"standalone","background_color":"%23f1f6fd","theme_color":"%2310306e"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10306e;--ink-2:#4a6aa5;--line:#cfe0f5;--bg:#f1f6fd;--panel:#fff;
 --accent:#1592e6;--accent-d:#0d6cb4;--accent-2:#e2f1fd;--warn:#b5651d;--bad:#c0392b;--good:#0e8f8f;
 --pv:#2f4fb5;--pv-d:#23398a;--pv-l:#e4eaf9;
 --hz:#0e7ab8;--hz-d:#0a5a88;--hz-l:#e0f0fa;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
header{background:linear-gradient(105deg,#10306e 0%,#14509e 60%,#1592e6 140%);color:#fff;padding:12px 14px}
header h1{margin:0;font-size:18px;font-weight:800}
header .meta{font-size:12px;opacity:.8}
nav{display:flex;gap:6px;overflow-x:auto;padding:9px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#navUndo{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-2);
 border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
#navBack{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;box-shadow:0 1px 4px rgba(21,146,230,.35)}
main{padding:8px 16px 28px;max-width:1180px;margin:0 auto}
section[hidden]{display:none}
h2{font-size:13.5px;color:var(--ink-2);margin:14px 0 5px;font-weight:700;letter-spacing:-.2px}
h2:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px;align-items:stretch;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:100%;
 display:flex;flex-direction:column;justify-content:center;min-height:56px;line-height:1.25}
.card .k{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere;letter-spacing:-.1px}
.card .v{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.card .n{font-size:10.5px;color:var(--ink-2);overflow-wrap:anywhere;opacity:.85}
.v.good{color:var(--good)}.v.bad{color:var(--bad)}.v.warn{color:var(--warn)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);
 max-width:100%;width:100%}
table{width:100%;min-width:0;border-collapse:collapse;font-size:13px;table-layout:auto}
/* טקסט נשבר לשורה שנייה כדי שהטבלה תיכנס למסך; מספרים ותאריכים לא נשברים */
/* ככלל: שורה בגובה אחיד — תא אחד בשורה אחת, בלי התרחבות ובלי שבירת מילים */
th,td{padding:5px 5px;text-align:right;border-bottom:1px solid var(--line);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:keep-all;hyphens:none;
 vertical-align:middle}
tbody tr,thead tr,tfoot tr{height:34px}
/* עמודות טקסט ארוך נחתכות בסוף השורה; לחיצה פותחת את הטקסט המלא */
td[data-l="הערה"]{max-width:140px;color:var(--ink-2)}
td[data-l="סיבה"],td[data-l="תיאור"],td[data-l="פרטים"],td[data-l="מה ישתנה"]{max-width:132px}
td[data-l="לקוח"],td[data-l="שם"],td[data-l="משימה"],td[data-l="פירוט"]{max-width:135px}
@media (min-width:1500px){
  td[data-l="הערה"]{max-width:260px}
  td[data-l="סיבה"],td[data-l="תיאור"],td[data-l="פרטים"],td[data-l="מה ישתנה"]{max-width:230px}
  td[data-l="לקוח"],td[data-l="שם"],td[data-l="משימה"],td[data-l="פירוט"]{max-width:190px}
}
th.num,td.num,td.nw,th.nw{white-space:nowrap;overflow-wrap:normal}
/* עמודת הפעולות תמיד צמודה לקצה ונגישה ללחיצה גם אם הטבלה רחבה */
.scroll table td.act,.scroll table th.act{position:sticky;left:0;z-index:2;background:var(--panel);
 box-shadow:-6px 0 6px -6px rgba(16,48,110,.18);white-space:nowrap;padding-left:7px;padding-right:7px}
.scroll table th.act{background:var(--accent-2);z-index:3}
.scroll table tfoot td.act{background:#eaf4fe}

@media (max-width:680px){ .scroll table td.act,.scroll table th.act{box-shadow:none;position:static} }
@media print{ .scroll table td.act,.scroll table th.act{position:static;box-shadow:none} }
th{background:var(--accent-2);color:var(--accent-d);font-size:12px;font-weight:700;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:700;background:#eaf4fe;color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
label{font-size:13px;color:var(--ink-2)}
select,input,textarea{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
input[type=number]{width:96px}input[type=date]{width:150px}
button.act{background:linear-gradient(180deg,#1b9bef,#0d7fd0);color:#fff;border:none;border-radius:8px;padding:9px 15px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font:inherit;cursor:pointer}
button.mini{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:inherit;font-size:13px;cursor:pointer}
button.danger{color:var(--bad)}
.note{display:inline;white-space:nowrap;cursor:pointer;color:var(--ink)}
.note:hover{text-decoration:underline}
.note:hover{text-decoration:underline}

.flag{color:var(--bad);font-weight:600}.ok{color:var(--good)}.mute{color:var(--ink-2);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;max-width:820px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grid2 label{display:flex;flex-direction:column;gap:3px}
details>summary{cursor:pointer;color:var(--ink-2);font-size:14px;padding:5px 2px}
.plan .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:5px 9px;border-bottom:1px solid var(--line);font-size:13.5px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.plan .r:last-child{border-bottom:none}.plan .r.tot{background:#eaf4fe;font-weight:700}
.plan .r b{min-width:48px;text-align:left}.plan .r span.m{min-width:70px;text-align:left;color:var(--ink-2)}

async function gFetch(url,opt){

async function folderFind(name,parent){
  const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='"+name+
    "' and trashed=false"+(parent?" and '"+parent+"' in parents":""));

  return ((await r.json()).files||[])[0]||null;
}
async function folderMake(name,parent){
  const meta={name:name,mimeType:"application/vnd.google-apps.folder"};
  if(parent) meta.parents=[parent];
  const r=await gFetch("https://www.googleapis.com/drive/v3/files?fields=id",
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(meta)});
  return (await r.json()).id;
}
async function folderGet(name,parent,key){
  const st=dState();

    try{ const r=await gFetch("https://www.googleapis.com/drive/v3/files/"+st[key]+"?fields=id,trashed");
      const j=await r.json(); if(j.id&&!j.trashed) return j.id; }catch(e){}
  }
  let f=await folderFind(name,parent);
  const id=f?f.id:await folderMake(name,parent);
  if(key) dSave({[key]:id});
  return id;
}

/* ============ xlsx decrypt + import ============ */
function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function cat(){const p=[...arguments];let n=0;p.forEach(x=>n+=x.length);const o=new Uint8Array(n);let i=0;p.forEach(x=>{o.set(x,i);i+=x.length});return o;}
function le32(n){const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,n,true);return a;}
const H512=b=>new Uint8Array(sha512.arrayBuffer(b));
function utf16(s){const a=new Uint8Array(s.length*2),d=new DataView(a.buffer);for(let i=0;i<s.length;i++)d.setUint16(i*2,s.charCodeAt(i),true);return a;}
const aesDec=(k,iv,d)=>new aesjs.ModeOfOperation.cbc(k,iv).decrypt(d);
async function decryptXlsx(buf,password,onP){
  const cfb=XLSX.CFB.read(new Uint8Array(buf),{type:"array"});
  const find=n=>{const f=cfb.FileIndex.find(x=>x.name===n);if(!f)throw new Error("stream "+n);return new Uint8Array(f.content);};
  const xml=new TextDecoder("utf-8").decode(find("EncryptionInfo").slice(8)), pkg=find("EncryptedPackage");
  const kdSalt=b64((xml.match(/<keyData[^>]*>/)[0].match(/saltValue="([^"]*)"/))[1]);
  const ek=xml.match(/<p:encryptedKey[^>]*>/)[0], at=a=>(ek.match(new RegExp(a+'="([^"]*)"'))||[])[1];
  const ekSalt=b64(at("saltValue")), spin=+at("spinCount"), kb=+at("keyBits")/8, encKey=b64(at("encryptedKeyValue"));
  let h=H512(cat(ekSalt,utf16(password)));
  for(let i=0;i<spin;i++){h=H512(cat(le32(i),h)); if(onP&&i%5000===0){onP(i/spin);await new Promise(r=>setTimeout(r));}}
  const key=H512(cat(h,new Uint8Array([0x14,0x6e,0x0b,0xe7,0xab,0xac,0xd0,0xd6]))).slice(0,kb);
  const secret=aesDec(key,cat(ekSalt,new Uint8Array(16)).slice(0,16),encKey).slice(0,kb);
  const total=Number(new DataView(pkg.buffer,pkg.byteOffset).getBigUint64(0,true));
  const data=pkg.slice(8), out=new Uint8Array(Math.ceil(data.length/4096)*4096);
  for(let i=0;i*4096<data.length;i++){
    out.set(aesDec(secret,H512(cat(kdSalt,le32(i))).slice(0,16),data.slice(i*4096,(i+1)*4096)),i*4096);
  }
  const res=out.slice(0,total);
  if(!(res[0]===0x50&&res[1]===0x4b)) throw new Error("הסיסמה שגויה");
  return res;
}
const xdate=v=>{ if(v==null||v==="")return null;
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*86400000));
    return d.getUTCFullYear()+"-"+pad2(d.getUTCMonth()+1)+"-"+pad2(d.getUTCDate());}
  const d=new Date(v); return isNaN(d)?null:iso(d);};
function importWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const M=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):[];
  const db={clients:[],tasks:[],time:[],bills:[],travel:[],plans:[],offDays:[],officeDates:[],busy:[],
    settings:Object.assign({},DB.settings),updated:Date.now()};
  const cl=M("לקוחות");
  const addClient=(name,type)=>{name=String(name||"").trim(); if(!name)return null;
    let c=db.clients.find(c=>c.name===name); if(c)return c.id;
    c={id:uid(),name,type:type||""}; db.clients.push(c); return c.id;};
  for(let i=3;i<cl.length;i++){ if(cl[i]&&cl[i][0]) addClient(cl[i][0],cl[i][1]); }
  const T=M("ניהול משימות");
  const hdr=(T[0]||[]).map(x=>String(x||"").trim());
  const col=(...n)=>{for(const x of n){const i=hdr.indexOf(x);if(i>=0)return i;}
    for(const x of n){const i=hdr.findIndex(h=>h.indexOf(x)===0);if(i>=0)return i;}return -1;};
  const c={name:col("שם מלא (משפחה + פרטי)","שם מלא"),year:col("שנה"),type:col("סוג"),sched:col('לו"ז',"לוז"),
    work:col("סטטוס עבודה","סטטוס"),subm:col("סטטוס הגשה","הוגש"),fee:col("שכר טרחה משרד"),
    est:col("צפי שעות"),extra:col("תוספת נטו לרונית (₪)","תוספת נטו"),notes:col("הערות"),file:col("מספר תיק")};
  const key2task={};
  for(let i=1;i<T.length;i++){
    const r=T[i]; if(!r) continue; const nm=r[c.name]; if(!nm||!String(nm).trim()) continue;
    const name=String(nm).trim();
    if(name==="כלליות") continue;
    const id=uid(), cid=addClient(name);
    const t={id,clientId:cid,year:r[c.year]||"",type:String(r[c.type]||"").trim(),
      fee:num(r[c.fee]),extra:num(r[c.extra]),est:num(r[c.est]),sched:xdate(r[c.sched]),
      work:String(r[c.work]||"").trim(),submit:String(r[c.subm]||"").trim().replace(/\s+/g," "),
      fileNo:r[c.file]||"",notes:String(r[c.notes]||"")};
    if(!SUBM.includes(t.submit)) t.submit=SUBM.find(s=>t.submit.indexOf(s)>=0)||"לטיפול";
    db.tasks.push(t);
    key2task[name+"|"+t.year]=key2task[name+"|"+t.year]||[];
    key2task[name+"|"+t.year].push(t);
  }
  const mapType=x=>{x=String(x||"").trim();
    return x==="דוח שנתי"?"דוח שנתי":(x==="ליווי שוטף"?"טיפול שוטף":x);};
  const byClient={};
  db.tasks.forEach(t=>{const n=db.clients.find(c=>c.id===t.clientId).name;(byClient[n]=byClient[n]||[]).push(t);});
  const pick=(name,year,type)=>{
    let list=key2task[name+"|"+year]||[];
    if(!list.length){
      const all=byClient[name]||[];
      if(!all.length) return null;
      if(all.length===1) return all[0];
      list=all.slice().sort((a,b)=>num(b.year)-num(a.year));
      return list[0];
    }
    const mt=mapType(type);
    return list.find(t=>t.type===mt||(mt==="דוח שנתי"&&t.type.indexOf("דוח שנתי")===0))||list[0];
  };
  wb.SheetNames.filter(n=>/^\d{4}-\d{2}$/.test(n)).sort().forEach(mn=>{
    const S=M(mn), cell=(r,cc)=>(S[r-1]&&S[r-1][cc-1]!=null)?S[r-1][cc-1]:null;
    for(let r=6;r<=70;r++){
      const d=cell(r,1), nm=cell(r,2), h=cell(r,6);
      if(!nm||!num(h)) continue;
      const name=String(nm).trim();
      if(name==="כלליות"){db.time.push({id:uid(),taskId:null,clientId:null,date:xdate(d)||(mn+"-01"),
        hours:num(h),desc:String(cell(r,5)||"כלליות")});continue;}
      const t=pick(name,cell(r,4),cell(r,3));
      db.time.push({id:uid(),taskId:t?t.id:null,clientId:t?t.clientId:addClient(name),
        date:xdate(d)||(mn+"-01"),hours:num(h),desc:String(cell(r,5)||"")});
    }
    for(let r=6;r<=25;r++){
      const nm=cell(r,15); if(!nm||!String(nm).trim()) continue;
      const name=String(nm).trim(), year=cell(r,16);
      const t=pick(name,year,null);
      const extraCell=num(cell(r,19));
      db.bills.push({id:uid(),month:mn,taskId:t?t.id:null,clientId:t?t.clientId:addClient(name),
        year:t?t.year:(year||""),date:xdate(cell(r,17))||(mn+"-01"),fee:num(cell(r,18)),
        extra:extraCell||(t?num(t.extra):0),amount:null,note:""});
    }
    const days=num(cell(52,25)),km=num(cell(53,25)),rate=num(cell(54,25));
    if(days||km) db.travel.push({month:mn,days,km,rate:rate||1});
  });
  db.tasks.forEach(t=>{ t.decision="לקחתי";
    const act=db.time.filter(x=>x.taskId===t.id).reduce((s,x)=>s+num(x.hours),0);
    const rem=Math.max(0,num(t.est)-act);
    if(t.submit==="לטיפול"&&t.sched&&rem>0) db.plans.push({id:uid(),taskId:t.id,date:t.sched,hours:rem});
  });
  const calc=wb.Sheets["מחשבון תיקים"], gv=a=>(calc&&calc[a]&&typeof calc[a].v==="number")?calc[a].v:null;
  const mz=wb.Sheets["מרכז"];
  db.settings.share=(mz&&mz.C3&&typeof mz.C3.v==="number")?mz.C3.v:1/3;
  db.settings.target=gv("E3")||gv("B3")||200;
  db.settings.targetNext=gv("E11")||gv("B11")||250;
  db.settings.hoursPerDay=gv("E12")||gv("B12")||7;
  db.settings.billEmail=DB.settings.billEmail||'dekel@homek.co.il';
  return db;
}

function planTitle(p){const t=taskById(p.taskId); return (t?tName(t)+" · "+(t.year||"")+" "+(t.type||""):"עבודה");}
function planTimes(p){
  const start=(p.start&&/^\d{2}:\d{2}$/.test(p.start))?p.start:"09:00";
  const [hh,mm]=start.split(":").map(Number);
  const s0=new Date(p.date+"T00:00:00"); s0.setHours(hh,mm,0,0);
  const e0=new Date(s0.getTime()+Math.max(0.25,num(p.hours))*3600000);
  const f=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes())+":00";
  return {start:f(s0),end:f(e0)};
}

async function gcalFindTwin(p,cal){
  try{
    const t=planTimes(p);
    const from=new Date(p.date+"T00:00:00"), to=new Date(from.getTime()+86400000);
    const url="https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(cal||"primary")+"/events?singleEvents=true"+
      "&maxResults=50&timeMin="+encodeURIComponent(from.toISOString())+
      "&timeMax="+encodeURIComponent(to.toISOString());
    const r=await gFetch(url); const j=await r.json();
    const title=planTitle(p), used=new Set(DB.plans.filter(x=>x!==p).map(x=>x.evId).filter(Boolean));
    const hit=(j.items||[]).find(ev=>ev.status!=="cancelled"&&ev.summary===title&&
      ev.start&&ev.start.dateTime&&ev.start.dateTime.slice(0,16)===t.start.slice(0,16)&&!used.has(ev.id));
    return hit?hit.id:null;
  }catch(e){ return null; }
}

async function gcalUpsert(p,quiet){
  if(!DB.settings.gcal) return {ok:false,why:"off"};
  if(!drive.token){ p.evDirty=true; drive.needsAuth=true; return {ok:false,why:"auth"}; }
  const t=planTimes(p);
  const body={summary:planTitle(p),description:"תוכנן במערכת רונית פינץ ערוסי, רו״ח",
    start:{dateTime:t.start,timeZone:"Asia/Jerusalem"},end:{dateTime:t.end,timeZone:"Asia/Jerusalem"}};
  const priv=planSrc(p)==="private";
  const col=priv?(DB.settings.gcalColorPriv||"9"):DB.settings.gcalColor;
  if(col) body.colorId=String(col);
  const cal=await gcalCalFor(p);
  if(priv&&p.evCal&&p.evCal!==cal&&p.evId){      /* עבר יומן — מוחקים מהישן */
    try{ await gFetch(gcalBase(p.evCal)+"/"+p.evId,{method:"DELETE"}); }catch(e){}
    p.evId=null;
  }
  p.evCal=cal;
  const base=gcalBase(cal);
  const send=async(id)=>{
    const r=await gFetch(id?(base+"/"+id):base,
      {method:id?"PATCH":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    return r.json();
  };
  /* תכנון שעדיין אין לו אירוע — בודקים שלא קיים כבר אירוע זהה */
  if(!p.evId){ const twin=await gcalFindTwin(p,cal); if(twin) p.evId=twin; }
  try{
    let j;
    try{ j=await send(p.evId); }
    catch(e1){
      /* יוצרים מחדש רק כשהאירוע באמת כבר לא קיים ביומן (404/410),
         ולא בכל שגיאה — אחרת נוצרות כפילויות */
      const gone=p.evId&&/\b(404|410)\b/.test(e1.message||"");
      if(!gone) throw e1;
      const twin=await gcalFindTwin(p,cal);     /* אולי הוא קיים תחת מזהה אחר */
      if(twin){ p.evId=twin; j=await send(twin); }
      else { p.evId=null; j=await send(null); }
    }
    if(j&&j.id){ p.evId=j.id; p.evDirty=false; saveLocal(); return {ok:true}; }
    p.evDirty=true; return {ok:false,why:"no-id"};
  }catch(e){
    p.evDirty=true;
    if(e.message==="auth"){dropTok();drive.needsAuth=true;}
    if(!quiet) toast("שליחה ליומן נכשלה: "+(e.message||"שגיאה"));
    return {ok:false,why:e.message||"err"};
  }
}

const hm2m=s2=>{const a=String(s2||"09:00").split(":");return (+a[0]||0)*60+(+a[1]||0);};
const m2hm=m=>pad2(Math.floor(m/60)%24)+":"+pad2(m%60);
const dayStartM=()=>hm2m(DB.settings.dayStart||"08:00");
const dayEndM=()=>hm2m(DB.settings.dayEnd||"19:00");
function dayTaken(k,skipPlanId){
  const iv=[];
  DB.plans.filter(p=>p.date===k&&p.id!==skipPlanId).forEach(p=>{
    const a=hm2m(p.start||"09:00"); iv.push([a,a+Math.round(num(p.hours)*60),"תכנון"]);});
  busyOn(k).forEach(b=>{const a=hm2m(b.start||"09:00");
    iv.push([a,a+Math.round(num(b.hours)*60),"יומן גוגל"]);});

function freeStarts(k,hours,skipPlanId){
  if(!k) return [];

  const need=Math.max(15,Math.round(num(hours||1)*60)), iv=dayTaken(k,skipPlanId), out=[];
  for(let t=dayStartM(); t+need<=dayEndM(); t+=15)
    if(!iv.some(x=>t<x[1]&&t+need>x[0])) out.push(m2hm(t));

}

/* ======= משימות קבועות שנפתחות לבד ======= */
const HEMON=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const AUTOFREQ=[{v:"vat2",t:'מע"מ דו־חודשי'},{v:"month",t:"חודשי"},{v:"quarter",t:"רבעוני"},{v:"year",t:"שנתי"}];

function autoPeriods(a){
  const out=[], st=String(a.from||iso(today()).slice(0,7));
  let [Y,M]=st.split("-").map(Number);
  const lim=new Date(today().getFullYear(),today().getMonth()+2,1);
  const step={vat2:2,month:1,quarter:3,year:12}[a.every]||2;
  if(a.every==="vat2") M=M%2===0?M-1:M;          /* מע"מ דו־חודשי מתחיל בחודש אי־זוגי */
  for(let i=0;i<60;i++){
    const endM=M+step-1, endY=Y+Math.floor((endM-1)/12), em=((endM-1)%12)+1;
    const due=new Date(endY,em,Math.min(num(a.day)||15,28));   /* החודש שאחרי סוף התקופה */
    if(due>lim) break;
    const label=step===1?HEMON[M-1]
      :(step===12?"שנת "+Y
      :HEMON[M-1]+" "+HEMON[em-1]+(endY!==Y?" "+endY:""));
    out.push({key:Y+"-"+pad2(M)+"|"+a.every, label:label, due:due, year:endY});
    const nm=M+step; Y=Y+Math.floor((nm-1)/12); M=((nm-1)%12)+1;
  }
  return out;
}

let repDir=null;
function idbGet(k){return new Promise(res=>{ if(!window.indexedDB) return res(null); let q; try{q=indexedDB.open("cpa-fs",1);}catch(e){return res(null);}
  q.onupgradeneeded=()=>q.result.createObjectStore("h");
  q.onsuccess=()=>{const tx=q.result.transaction("h","readonly").objectStore("h").get(k);
    tx.onsuccess=()=>res(tx.result||null); tx.onerror=()=>res(null);};
  q.onerror=()=>res(null);});}
function idbSet(k,v){return new Promise(res=>{ if(!window.indexedDB) return res(false); let q; try{q=indexedDB.open("cpa-fs",1);}catch(e){return res(false);}
  q.onupgradeneeded=()=>q.result.createObjectStore("h");
  q.onsuccess=()=>{const tx=q.result.transaction("h","readwrite").objectStore("h").put(v,k);
    tx.onsuccess=()=>res(true); tx.onerror=()=>res(false);};
  q.onerror=()=>res(false);});}

const NUMCELL=/^[-+]?[\d,.]+\s*(₪|%|ש׳|שעות)?$/;
function table(head,rows,foot,keep){
  const plain=c=>String(c==null?"":c).replace(/<[^>]*>/g,"").replace(/&nbsp;/g," ").trim();
  /* עמודת פעולות = העמודה האחרונה כשיש בה לחצנים */
  const lastI=head.length-1;
  const actCol=rows.length>0&&rows.every(r=>/<button|<input|<select/.test(String(r[lastI]==null?"":r[lastI])))
    ||/^(טיפול|פעולות)?$/.test(String(head[lastI]==null?"":head[lastI]).trim())&&rows.some(r=>/<button/.test(String(r[lastI]||"")));
  const numCol=head.map((h,i)=>{
    const vals=rows.map(r=>plain(r[i])).filter(v=>v!==""&&v!=="—");
    return vals.length>0&&vals.every(v=>NUMCELL.test(v));});
  /* עמודה שכל ערכיה קצרים לא נשברת כלל */
  const nwCol=head.map((h,i)=>{
    if(numCol[i]) return false;
    const vals=rows.map(r=>plain(r[i]));
    const longest=vals.reduce((a,v)=>Math.max(a,v.length),0);
    const word=vals.reduce((a,v)=>Math.max(a,...v.split(/\s+/).map(x=>x.length)),0);
    return longest<=16||word<=8;});
  const cls=(i,extra)=>{const c=[];
    if(keep&&keep.length&&keep.indexOf(i)<0) c.push("m-hide");
    if(numCol[i]) c.push("num");
    else if(nwCol[i]) c.push("nw");
    if(actCol&&i===lastI) c.push("act");
    if(extra) c.push(extra);
    return c.length?' class="'+c.join(" ")+'"':'';};
  const td=(c,i)=>{const t=plain(c);
    const tip=(t.length>18&&!/<button|<input|<select/.test(String(c==null?"":c)))
      ?` title="${t.replace(/"/g,"&quot;")}"`:"";
    return `<td${cls(i)}${tip} data-l="${String(head[i]==null?"":head[i]).replace(/"/g,"&quot;")}">${c==null?"":c}</td>`;};
  return `<div class="scroll"><table><thead><tr>${head.map((h,i)=>
    `<th${cls(i)} data-l="${String(h==null?"":h).replace(/"/g,"&quot;")}">${h}</th>`).join("")}</tr></thead>
   <tbody>${rows.length?rows.map(r=>{
     const pv=/class="tag priv"/.test(r.map(x=>String(x==null?"":x)).join(""));
     return `<tr${pv?' class="rowpv"':""}>${r.map(td).join("")}</tr>`;}).join("")
   :`<tr><td colspan="${head.length}" class="mute">אין נתונים</td></tr>`}</tbody>
   ${foot?`<tfoot><tr>${foot.map(td).join("")}</tr></tfoot>`:""}</table></div>`;}

function feeByClient(mine){
  const ids=[...new Set(mine.map(t=>t.clientId).concat(retClients().map(c=>c.id)))].filter(Boolean);
  const rows=[]; let tFee=0,tMine=0,tH=0,tB=0;
  ids.map(id=>clientOf(id)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name,"he")).forEach(c=>{
    const ts=mine.filter(t=>t.clientId===c.id&&!inRet(t));
    const r0=retOf(c), rm=r0?retMonthsPer(c):[], rAmt=r0?rm.length*num(r0.amount):0, sh=srcShare(srcOf(c.id));
    const rH=r0?rm.reduce((a,m)=>a+retHoursIn(c,m),0):0;
    const rB=r0?DB.bills.filter(b=>isRetBill(b)&&b.clientId===c.id&&inPer(b.month)).reduce((a,b)=>a+billAmount(b),0):0;
    const fee=ts.reduce((a,t)=>a+num(t.fee)+num(t.extra),0)+rAmt;
    const my=ts.reduce((a,t)=>a+mineEff(t),0)+rAmt*sh;
    const h=ts.reduce((a,t)=>a+taskHours(t.id),0)+rH;
    const bd=ts.reduce((a,t)=>a+taskBilled(t.id),0)+rB;
    tFee+=fee;tMine+=my;tH+=h;tB+=bd;
    rows.push([`<b>${esc(c.name)}</b>`,"",f0(fee),f0(my),f1(h),h>0?f0(my/h):"—",f0(bd)]);

      rm.length+" חודשים",f0(rAmt),f0(rAmt*sh),f1(rH),rH>0?f0(rAmt*sh/rH):"—",f0(rB)]);
    ts.forEach(t=>rows.push(['<span class="mute">↳</span> '+esc(t.title||t.type||"משימה"),esc(String(t.year||"")),

      f0(taskBilled(t.id))]));
  });
  if(!rows.length) return "";

    return {title:k==="mine"?"שכ\"ט שלי":(k==="share"?"שכ\"ט שלי — קבלנות משנה":"שכ\"ט שלי — ישיר"),rows,
      cols:[["fee","שכ\"ט ללקוח","₪"],["mine","שכ\"ט שלי","₪"]],main:"mine",
      note:"שכ\"ט שלי: בקבלנות משנה — החלק שלך בשכ\"ט ועוד תוספת; בישיר — כל השכ\"ט. במשימה שכבר חויבה נספר הסכום שחויב בפועל."};}
  if(k==="partpct"){
    D.mine.filter(t=>taskShare(t)<1).forEach(t=>rows.push(tRow(t,{fee:num(t.fee),mine:mineEff(t)})));
    D.rcs.filter(c=>sh(c)<1).forEach(c=>retRows(c,a=>({fee:a,mine:a*sh(c)})));
    return {title:"% שלי בקבלנות משנה",rows,cols:[["fee","שכ\"ט ללקוח","₪"],["mine","שכ\"ט שלי","₪"]],
      der:[["%","%",v=>v.fee>0?v.mine/v.fee*100:null]],main:"%"};}
  if(k==="due"||k==="paid"||k==="pctpaid"){
    D.bills.forEach(b=>{ const t=b.taskId?taskById(b.taskId):null;
      const v={b:billAmount(b),g:billTotal(b),p:billPaid(b)};
      const lab=(t?tRow(t,v).lab:(isRetBill(b)?"ריטיינר":"דרישה ללא משימה"))+" · "+mName(b.month);
      rows.push(Object.assign(xRow(billCid(b),lab,v,"b"+(b.month||"")+"_"+b.id),{tid:t?t.id:null}));});
    return {title:k==="due"?"חויב":(k==="paid"?"נגבה":"% גבייה"),rows,
      cols:k==="pctpaid"?[["g","חויב כולל מע\"מ","₪"],["p","נגבה","₪"]]:[["b","חויב לפני מע\"מ","₪"],["g","כולל מע\"מ","₪"],["p","נגבה","₪"]],
      der:k==="pctpaid"?[["%","% גבייה",v=>v.g>0?v.p/v.g*100:null]]:[],
      main:k==="due"?"b":(k==="paid"?"p":"%"),
      note:"דרישות התשלום של חודשי התקופה. נגבה הוא התשלום שנרשם, כולל מע\"מ."};}
  if(k==="notbilled"){
    D.mine.filter(t=>!inRet(t)&&!billedTask(t.id)).forEach(t=>rows.push(tRow(t,{a:taskMine(t)})));
    D.rcs.forEach(c=>retMonthsPer(c).filter(m=>!retBillFor(c.id,m)).forEach(m=>
      rows.push(xRow(c.id,"ריטיינר "+mName(m),{a:num(retOf(c).amount)*sh(c)},"ret"+m))));
    return {title:"טרם חויב",rows,cols:[["a","טרם חויב","₪"]],main:"a"};}
  if(k==="hours"){
    const inc=DB.settings.inclGeneral;
    D.time.forEach(x=>{ const h=num(x.hours), t=x.taskId?taskById(x.taskId):null;
      if(t){ const tr=tRow(t,{h});
        if(inRet(t)){ const m=monthOf(x.date); tr.lab+=" · "+mName(m); tr.key="t"+t.id+"_"+m; }
        rows.push(tr); }
      else if(x.clientId) rows.push(xRow(x.clientId,"שעות על הלקוח בלי משימה",{h},"cli"));
      else if(inc) rows.push(xRow(null,"שעות לא לחיוב",{h},"gen")); });
    return {title:"שעות"+(inc?" (כולל לא לחיוב)":" (רק לחיוב)"),rows,cols:[["h","שעות","h"]],main:"h"};}
  if(k==="rate"){
    const all=(S.rateMode||"all")!=="act", inc=DB.settings.inclGeneral;
    const rk=t=>(t&&inRet(t))?"ret":null;
    D.bills.filter(b=>!isRetBill(b)).forEach(b=>{const t=b.taskId?taskById(b.taskId):null;
      const v={b:billAmount(b),r:0,n:0,h:0,rem:0};
      rows.push(t?tRow(t,v):xRow(billCid(b),"דרישה ללא משימה · "+mName(b.month),v,"b"+b.id));});
    D.rcs.forEach(c=>retRows(c,a=>({b:0,r:a*sh(c),n:0,h:0,rem:0})));
    if(all) D.mine.filter(t=>!inRet(t)&&!billedTask(t.id)).forEach(t=>rows.push(tRow(t,{b:0,r:0,n:taskMine(t),h:0,rem:0})));
    D.time.forEach(x=>{ const h=num(x.hours), t=x.taskId?taskById(x.taskId):null;
      const rm=monthOf(x.date);
      if(t){ if(rk(t)) rows.push(xRow(t.clientId,"ריטיינר "+mName(rm),{b:0,r:0,n:0,h,rem:0},"ret"+rm));
             else rows.push(tRow(t,{b:0,r:0,n:0,h,rem:0})); }
      else if(x.clientId){ const c=clientOf(x.clientId);
        rows.push(retOf(c)?xRow(x.clientId,"ריטיינר "+mName(rm),{b:0,r:0,n:0,h,rem:0},"ret"+rm)
          :xRow(x.clientId,"שעות על הלקוח בלי משימה",{b:0,r:0,n:0,h,rem:0},"cli")); }
      else if(inc) rows.push(xRow(null,"שעות לא לחיוב",{b:0,r:0,n:0,h,rem:0},"gen")); });
    if(all) D.open.forEach(t=>{const r=taskRemaining(t); if(r>0) rows.push(tRow(t,{b:0,r:0,n:0,h:0,rem:r}));});
    const cols=[["b","חויב","₪"],["r","ריטיינר","₪"]].concat(all?[["n","טרם חויב","₪"]]:[]).concat([["h","שעות","h"]]).concat(all?[["rem","יתרת שעות","h"]]:[]);
    return {title:"תעריף אפקטיבי "+(all?"(כולל צפי)":"(בפועל)"),rows,cols,
      der:[["rate","תעריף",v=>{const m=v.b+v.r+(all?v.n:0), h=v.h+(all?v.rem:0); return h>0?m/h:null;}]],main:"rate",
      note:"תעריף = (חויב + ריטיינר"+(all?" + טרם חויב":"")+") ÷ (שעות"+(all?" + יתרת שעות":"")+"). שעות של משימות בריטיינר נספרות בשורת הריטיינר. הממוצע בשורת הסה\"כ הוא המספר בקובייה."};}
  return null;
}
function drillGeneric(k){
  const sp=drillSpec(k); if(!sp) return null;
  const by=sp.onlyClient?"client":(S.drillBy||"client");
  const fmt=(x,f)=>x==null?"—":(f==="₪"?f0(x):(f==="h"?f1(x):(f==="%"?Math.round(x)+"%":(f==="n"?String(x):f0(x)))));
  const keys=sp.cols.map(c=>c[0]), der=sp.der||[];
  const add=(a,v)=>{keys.forEach(k2=>a[k2]=(a[k2]||0)+num(v[k2]));return a;};
  const zero=()=>Object.fromEntries(keys.map(k2=>[k2,0]));
  const cn=c=>c?clientName(c):"כללי";
  const vals=v=>sp.cols.map(c=>fmt(v[c[0]],c[2])).concat(der.map(d=>fmt(d[2](v),d[0]==="%"?"%":"₪")));
  const bold=a=>a.map(x=>`<b>${x}</b>`);
  const eb=tid=>tid?`<button class="mini" onclick="editTask('${tid}')">עריכה</button>`:"";
  /* מסך לקוחות — שורה אחת ללקוח */
  if(sp.onlyClient){
    const g={}; sp.rows.forEach(r=>{const id=r.cid||"_"; g[id]=g[id]||{cid:r.cid,v:zero()}; add(g[id].v,r.v);});
    const list=Object.values(g).sort((a,b)=>cn(a.cid).localeCompare(cn(b.cid),"he"));
    const tot=list.reduce((a,x)=>add(a,x.v),zero());
    const H=["לקוח"].concat(sp.cols.map(c=>c[1])).concat(der.map(d=>d[1]));
    return `<div id="drillBox" class="panel"><div class="row"><b>${sp.title} — פירוט</b>
      <button class="ghost noprint" onclick="drill('${k}')">סגירה</button></div>
      ${table(H,list.map(x=>[esc(cn(x.cid))].concat(vals(x.v))),[`סה"כ · ${list.length} לקוחות`].concat(bold(vals(tot))),H.map((h,i)=>i))}
      <div class="mute">סה"כ <b>${fmt(tot[sp.main],(sp.cols.find(c=>c[0]===sp.main)||[])[2])}</b> — זהה למספר בקובייה.</div></div>`;
  }
  /* כל פריט בשורה משלו: משימה, חודש ריטיינר, דרישת תשלום */
  const items={};
  sp.rows.forEach(r=>{ const g=(r.cid||"_")+"|"+(r.key?("k"+r.key):("t"+r.tid));
    if(!items[g]) items[g]={cid:r.cid,tid:r.tid||null,lab:r.lab,key:r.key||"",v:zero()};
    add(items[g].v,r.v); });
  const ord=x=>String(x.key||"").replace(/^ret/,"0ret");
  const list=Object.values(items).sort((a,b)=>cn(a.cid).localeCompare(cn(b.cid),"he")
    ||(/^ret/.test(a.key)===/^ret/.test(b.key)?0:(/^ret/.test(a.key)?1:-1))
    ||ord(a).localeCompare(ord(b))||String(a.lab).localeCompare(String(b.lab),"he"));
  const tot=list.reduce((a,x)=>add(a,x.v),zero());
  const H=["לקוח / פריט"].concat(sp.cols.map(c=>c[1])).concat(der.map(d=>d[1])).concat([""]);
  const two=(top,sub)=>`<b>${esc(top)}</b><br><span class="mute">${esc(sub)}</span>`;
  const body=[];
  if(by==="task"){
    list.forEach(x=>body.push([two(cn(x.cid),x.lab)].concat(vals(x.v)).concat([eb(x.tid)])));
  } else {
    const byC={}; list.forEach(x=>{const id=x.cid||"_"; (byC[id]=byC[id]||[]).push(x);});
    Object.values(byC).forEach(arr=>{
      arr.forEach(x=>body.push([two(cn(x.cid),x.lab)].concat(vals(x.v)).concat([eb(x.tid)])));
      const st=arr.reduce((a,x)=>add(a,x.v),zero());
      body.push([`<b>סה"כ ${esc(cn(arr[0].cid))}</b><br><span class="mute">${arr.length} פריטים</span>`].concat(bold(vals(st))).concat([""]));
    });
  }
  const nC=new Set(list.map(x=>x.cid||"_")).size;
  const T=[`סה"כ · ${list.length} פריטים · ${nC} לקוחות`].concat(bold(vals(tot))).concat([""]);
  const mainCol=sp.cols.find(c=>c[0]===sp.main), mainDer=der.find(d=>d[0]===sp.main);
  const mainVal=mainDer?fmt(mainDer[2](tot),mainDer[0]==="%"?"%":"₪"):fmt(tot[sp.main],mainCol?mainCol[2]:"");
  const tg=(v,l)=>`<button class="chip${by===v?" on":""}" onclick="S.drillBy='${v}';renderAll();showTab('status')">${l}</button>`;
  return `<div id="drillBox" class="panel"><div class="row"><b>${sp.title} — פירוט</b>
    ${tg("client","לפי לקוח")+tg("task","לפי משימה")}
    <button class="ghost noprint" onclick="drill('${k}')">סגירה</button></div>
    ${table(H,body,T,H.map((h,i)=>i).filter(i=>i!==H.length-1))}
    <div class="mute">סה"כ <b>${mainVal}</b> — זהה למספר בקובייה.${sp.note?" "+sp.note:""}</div></div>`;
}

function drillBox(){
  const k=S.drill; if(!k) return "";
  { const g=drillGeneric(k); if(g!=null) return g; }
  const mine=takenTasks(), open=mine.filter(isOpen);
  const row=t=>[tName(t),t.year,t.type,t.submit,f0(t.fee),f0(t.extra)||"",f0(mineEff(t)),
    f1(t.est),f1(taskHours(t.id)),f1(taskRemaining(t)),
    `<button class="mini" onclick="editTask('${t.id}')">עריכה</button>`];
  const H=["לקוח","שנה","סוג","הגשה","שכ\"ט ללקוח","תוספת","שכ\"ט שלי","צפי שעות","שעות","יתרת שעות",""];
  const box=(title,html)=>`<div id="drillBox" class="panel"><div class="row"><b>${title}</b>
    <button class="ghost noprint" onclick="drill('${k}')">סגירה</button></div>${html}</div>`;
  if(k==="share"||k==="full"||k==="mine"){
    const bl=DB.bills.filter(b=>inSrc(billSrc(b)));
    const billed=bl.reduce((s,b)=>s+billAmount(b),0);
    const paid=bl.reduce((s,b)=>s+billPaid(b),0);
    const part=mine.filter(t=>taskShare(t)<1), full=mine.filter(t=>taskShare(t)>=1);
    const sum=(l,f)=>l.reduce((a,t)=>a+f(t),0);
    const rcs=retClients();
    const rPart=rcs.filter(c=>srcShare(srcOf(c.id))<1).reduce((a,c)=>a+retAccrued(c)*srcShare(srcOf(c.id)),0);
    const rFull=rcs.filter(c=>srcShare(srcOf(c.id))>=1).reduce((a,c)=>a+retAccrued(c),0);
    const retRows=rcs.map(c=>[esc(c.name)+' <span class="tag ret">ריטיינר</span>',"","","",
      f0(retAccrued(c)),"",f0(retAccrued(c)*srcShare(srcOf(c.id))),"",f1(retHours(c)),"",""]);
    const sharePart=sum(part,mineEff)+rPart, fullMine=sum(full,mineEff)+rFull;
    const orphan=bl.filter(b=>!isRetBill(b)&&(!b.taskId||!mine.some(t=>t.id===b.taskId))).reduce((s,b)=>s+billAmount(b),0);
    if(k==="share") return box("חלקי — "+Math.round(num(DB.settings.share)*100)+"% משכ\"ט המשרד",
      `<div class="mute">רק משימות שבהן את לא מקבלת 100% — העבודה מול הורוביץ.
        החלק שלך = שכ"ט × ${Math.round(num(DB.settings.share)*100)}% + תוספת נטו. למשימה שכבר נדרשה — הסכום שנדרש בפועל.</div>`+
      table(H,part.map(row),["סה\"כ","","","",f0(sum(part,t=>num(t.fee))),f0(sum(part,t=>num(t.extra))),
        f0(sharePart),f1(sum(part,t=>num(t.est))),f1(sum(part,t=>taskHours(t.id))),
        f1(sum(part,taskRemaining)),""],[0,6,10]));
    if(k==="full"){
      const rf=rcs.filter(c=>srcShare(srcOf(c.id))>=1);
      const rr=rf.map(c=>[esc(c.name)+' <span class="tag ret">ריטיינר</span>',
        retMonths(c).length+" חודשים","","",f0(retAccrued(c)),"",f0(retAccrued(c)),"",f1(retHours(c)),"",""]);
      return box("שכ\"ט מלא — 100% שלך",
      `<div class="mute">משימות של לקוחות פרטיים, שבהן כל שכר הטרחה שלך, בתוספת הריטיינר שנצבר.</div>`+
      ((full.length||rr.length)?table(H,full.map(row).concat(rr),
        ["סה\"כ","","","",f0(sum(full,t=>num(t.fee))+rFull),f0(sum(full,t=>num(t.extra))),
        f0(fullMine),f1(sum(full,t=>num(t.est))),
        f1(sum(full,t=>taskHours(t.id))+rf.reduce((a,c)=>a+retHours(c),0)),
        f1(sum(full,taskRemaining)),""],[0,6,10])
        :'<div class="mute">אין עדיין משימות של לקוחות פרטיים בתצוגה הזו.</div>'));}
    const notB=mine.filter(t=>!inRet(t)&&!billedTask(t.id));
    return box("שכ\"ט שלי — מאיפה מורכב",
      table(["מרכיב","סכום"],[
        ...(S.src==="private"?[]:[["חלקי — "+part.length+" משימות חלקיות"+(rPart?" + ריטיינר":""),f0(sharePart)+" ₪"]]),
        ["שכ\"ט מלא — "+full.length+" משימות 100%"+(rFull?" + ריטיינר "+f0(rFull):""),f0(fullMine)+" ₪"],
        ...(rcs.length?[["מזה ריטיינר שנצבר ("+rcs.map(c=>retMonths(c).length+" חודשים").join(", ")+")",f0(rPart+rFull)+" ₪"]]:[]),
        ...(orphan?[["דרישות שאינן משויכות למשימה",f0(orphan)+" ₪"]]:[]),
        ["שכ\"ט שלי",`<b>${f0(sharePart+fullMine+orphan)} ₪</b>`],
        ["מזה חויב",f0(billed)+" ₪"],
        ["מזה טרם חויב ("+notB.length+" משימות)",f0(notB.reduce((a,t)=>a+taskMine(t),0))+" ₪"],
        ["מתוך החיוב — נגבה",f0(paid)+" ₪"],
        ["יתרה",f0(billed-paid)+" ₪"]])
      +`<div class="mute">שכ"ט ללקוח בתיקים שלקחתי: ${f0(sum(mine,t=>num(t.fee)))} ₪.</div>`
      +feeByClient(mine));
  }
  if(k==="tasks"||k==="fee") return box(
    k==="tasks"?"מתוך אילו משימות מורכב המספר":(k==="fee"?"שכ\"ט ללקוח — פירוט":"החלק שלך — פירוט"),
    (()=>{const totMine=mine.reduce((s,t)=>s+mineEff(t),0);

      return `<div class="mute">כל המשימות שסומנו "לקחתי". אצל הורוביץ חלקי = שכ"ט × ${Math.round(DB.settings.share*100)}% + תוספת נטו;
        אצל לקוח פרטי — שכר הטרחה כולו שלך. למשימה שכבר נדרשה — הסכום שנדרש בפועל.</div>`+
      table(H,mine.map(row),["סה\"כ","","","",f0(mine.reduce((s,t)=>s+num(t.fee),0)),

        f1(mine.reduce((s,t)=>s+num(t.est),0)),f1(mine.reduce((s,t)=>s+taskHours(t.id),0)),

        (orphan?` כולל ${f0(orphan)} ₪ בדרישות שאינן משויכות למשימה.`:"")+`</div>`

  if(k==="clients"){

        ["סה\"כ","",sum(2),sum(3),f1(sum(4)),f0(sum(5)),f0(sum(6))])
      +(skipped?`<div class="mute">${skipped} לקוחות לא נספרים — אין להם משימה שנלקחה ולא בוטלה לגבייה.

    const byC={}; src.forEach(x=>{const t=x.taskId?taskById(x.taskId):null;
      const n=t?tName(t):(x.clientId?clientName(x.clientId):"כלליות"); byC[n]=(byC[n]||0)+num(x.hours);});
    const tot=src.reduce((s,x)=>s+num(x.hours),0);

    return box("שעות בפועל — לפי לקוח"+(inc?" (כולל לא לחיוב)":" (רק לחיוב)"),

        ["סה\"כ",f1(tot)])
      +`<div class="mute">סה"כ ${f1(tot)} שעות — בדיוק כמו בקוביית "שעות בפועל".`+
        (inc?"":` שעות לא לחיוב (${f1(gen)}) אינן נכללות; אפשר להוסיף אותן בסימון "כולל לא לחיוב" במסך מצב.`)+`</div>`);

/* ===== תקופה במסך מצב ===== */
const PERMODES=[{v:"upto",t:"עד החודש",ti:"הכול מההתחלה ועד החודש הנוכחי"},
  {v:"year",t:"שנה מצטברת",ti:"השנה הנוכחית, מינואר ועד דצמבר"},
  {v:"range",t:"טווח",ti:"טווח חודשים לבחירתך"},{v:"all",t:"הכול",ti:"בלי הגבלת תקופה"}];
function perRange(){
  const cur=iso(today()).slice(0,7), y=cur.slice(0,4);
  const mode=S.perMode||"upto";
  let from="0000-00", to="9999-99";
  if(mode==="upto"){ to=cur; }
  else if(mode==="year"){ from=y+"-01"; to=y+"-12"; }
  else if(mode==="range"){ from=S.perFrom||y+"-01"; to=S.perTo||cur;
    if(from>to){const x=from;from=to;to=x;} }
  if(S.perNoFuture!==false&&to>cur) to=cur;     /* בלי חודשים עתידיים */
  return {mode,from,to,cur};
}
const inPer=m=>{ if(!m) return false; const r=perRange(); return m>=r.from&&m<=r.to; };
const inPerDate=d=>inPer(String(d||"").slice(0,7));
function perBar(){
  const r=perRange();
  return `<div class="srcbar noprint"><b>תקופה:</b>
    ${PERMODES.map(x=>`<button class="chip${r.mode===x.v?" on":""}" data-per="${x.v}" title="${esc(x.ti)}">${x.t}</button>`).join("")}
    ${r.mode==="range"?`<label class="mute">מ<input type="month" id="perF" value="${esc(r.from)}"></label>
      <label class="mute">עד<input type="month" id="perT" value="${esc(S.perTo||r.to)}"></label>`:""}
    <label class="mute"><input type="checkbox" id="perNF" ${S.perNoFuture!==false?"checked":""}> בלי עתידיים</label>
    <span class="mute pernote">· ${esc(r.from==="0000-00"?"מההתחלה":r.from)} עד ${esc(r.to==="9999-99"?"הסוף":r.to)}</span></div>`;
}
/* שיוך משימה לתקופה: לפי חודש הדרישה אם נדרשה, אחרת לפי יעד ההגשה */
function perTask(t){
  const r=perRange(); if(r.mode==="all") return true;
  const bs=DB.bills.filter(b=>b.taskId===t.id);
  if(bs.length) return bs.some(b=>inPer(b.month));
  if(t.sched) return inPer(String(t.sched).slice(0,7));
  return true;                      /* בלי יעד הגשה — תמיד נספרת */
}

function taskRow(t){

const REPNAMES={open:"משימות פתוחות",cancel:"משימות שבוטלו",sched:"לוח זמנים",pay:"דרישת תשלום",
  doc:"מסמך דרישת תשלום",ret:"ריטיינר",
  collect:"גבייה",below:"גבייה מתחת ליעד",nobill:"לא לגבייה",feas:"בדיקות כדאיות",
  drill:"לפי לקוח",custom:"דוח מותאם"};
const CUSTOMCOLS={
  client:{t:"לקוח",v:t=>tName(t)}, year:{t:"שנה",v:t=>t.year},
  type:{t:"מוצר",v:t=>t.type}, submit:{t:"סטטוס הגשה",v:t=>t.submit},
  work:{t:"סטטוס עבודה",v:t=>t.work}, decision:{t:"החלטה",v:t=>t.decision||"לקחתי"},
  sched:{t:"יעד הגשה",v:t=>heDate(t.sched)}, est:{t:"צפי שעות",v:t=>f1(t.est)},
  act:{t:"שעות",v:t=>f1(taskHours(t.id))},
  left:{t:"שעות שנותרו",v:t=>f1(taskRemaining(t))},
  fee:{t:"שכ\"ט ללקוח",v:t=>f0(t.fee)}, extra:{t:"תוספת",v:t=>f0(t.extra)},
  mine:{t:"החלק שלי",v:t=>f0(mineEff(t))},
  rateEst:{t:"לשעה צפי",v:t=>num(t.est)>0?f0(mineEff(t)/num(t.est)):""},
  rateAct:{t:"לשעה בפועל",v:t=>taskHours(t.id)>0?f0(mineEff(t)/taskHours(t.id)):""},
  bill:{t:"דרישת תשלום",v:t=>t.noBill?"לא לגבייה":(billedTask(t.id)?"חויב":"טרם חויב")},
  note:{t:"הערה",v:t=>`<span class="note" title="${esc(t.notes||"")}">${esc(t.notes||"")}</span>`},
  checkNote:{t:"סיבת החלטה",v:t=>esc(t.checkNote||"")},
  fileNo:{t:"מספר תיק",v:t=>{const c=DB.clients.find(c=>c.id===t.clientId);return c?esc(c.fileNo||""):"";}},
  target:{t:"עמידה ביעד",v:t=>{const h=taskHours(t.id), base=h>0?h:num(t.est);
    if(!base) return "";
    const r=mineEff(t)/base;
    return `${f0(r)} ${Math.round(r)>=taskTarget(t)?'<span class="ok">מעל</span>':'<span class="flag">מתחת</span>'}`;}}
};

function viewClients(){
  const q=(S.clientQ||"").trim();
  const TOOLS=printBtn();
  const ft=S.clientType||"";
  let list=DB.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,"he"));
  if(q) list=list.filter(c=>((c.name||"")+" "+(c.fileNo||"")+" "+(c.notes||"")).indexOf(q)>=0);
  if(ft) list=list.filter(c=>(c.type||"")===ft);
  if(S.src) list=list.filter(c=>srcOf(c.id)===S.src);
  const rows=list.map(c=>{
    const ts=DB.tasks.filter(t=>t.clientId===c.id), bt=ts.filter(billable);
    const h=ts.reduce((s,t)=>s+taskHours(t.id),0), mine=bt.reduce((s,t)=>s+taskMine(t),0);
    return [esc(c.name),
      srcOf(c.id)==="private"?'<span class="tag priv">ישיר</span>':'<span class="mute">קבלנות משנה</span>',
      esc(c.fileNo||"—"),esc(c.type||"—"),ts.length,ts.filter(isOpen).length,f1(h),
      f0(bt.reduce((s,t)=>s+num(t.fee),0)),f0(mine),h>0?f0(mine/h):"",
      `<span class="note" onclick="clientNotes('${c.id}')" title="${esc(c.notes||"לחיצה להוספת פרטים")}">${c.notes?esc(c.notes):'<span class="mute">+ פרטים</span>'}</span>`,
      `<button class="mini" onclick="clientNotes('${c.id}')">פרטים נוספים</button>
       <button class="mini" onclick="editClient('${c.id}')">עריכה</button>
       <button class="mini danger" onclick="delClient('${c.id}')">מחיקה</button>`];});
  return `${TOOLS}${srcBar()}<h2>לקוחות (${list.length}${list.length!==DB.clients.length?" מתוך "+DB.clients.length:""})</h2>
  <div class="mute">לקוח = תיק. כל שורת עבודה לשנה ולמוצר היא משימה בתוך התיק.</div>

    <label>סוג<select id="clFilterType"><option value="">הכול</option>${opts(["עצמאי — פטור","עצמאי — מורשה","חברה","שכיר","עמותה"],ft)}</select></label>
    <button class="ghost" id="clClear">ניקוי</button>
  </div>
  <div class="row noprint"><input id="clNew" placeholder="שם לקוח חדש">
    <input id="clNum" placeholder="מספר תיק" style="width:120px">
    <select id="clType">${opts(["","עצמאי — פטור","עצמאי — מורשה","חברה","שכיר","עמותה"],"")}</select>
    <select id="clSrc">${opts(SRCS,S.src==="private"?"private":"horowitz")}</select>
    <button class="act" id="clAdd">הוספה</button></div>
  <div id="clientForm"></div>
  ${table(["לקוח","מקור","מספר תיק","סוג","משימות","פתוחות","שעות","שכ\"ט ללקוח","שכ\"ט שלי","תעריף","פרטים",""],rows,null,[0,1,8,11])}`;

function exportXlsx(){
  const wb=XLSX.utils.book_new();
  wb.Workbook=wb.Workbook||{}; wb.Workbook.Views=[{RTL:true}];   /* כל החוברת מימין לשמאל */
  const add=(name,rows)=>{
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!views"]=[{RTL:true}];                 /* גיליון מימין לשמאל */
    const head=rows[0]||[];
    ws["!cols"]=head.map((h,i)=>{
      let w=String(h==null?"":h).length;
      rows.forEach(r=>{const v=r[i]; const L=String(v==null?"":v).length; if(L>w) w=L;});
      return {wch:Math.min(Math.max(w+2,8),45)};});
    ws["!freeze"]={xSplit:"0",ySplit:"1",topLeftCell:"A2",activePane:"bottomLeft",state:"frozen"};
    XLSX.utils.book_append_sheet(wb,ws,name);};
  add("תיקים",[["לקוח","החלטה","שנה","סוג","סטטוס עבודה","סטטוס הגשה","לו\"ז","שכ\"ט ללקוח","תוספת נטו","שכ\"ט שלי","צפי שעות","שעות","שעות שנותרו","נדרש תשלום"],
    ...DB.tasks.map(t=>[tName(t),t.decision||"לקחתי",t.year,t.type,t.work,t.submit,t.sched||"",
      num(t.fee),num(t.extra),mineEff(t),num(t.est),taskHours(t.id),taskRemaining(t),
      t.noBill?"לא לגבייה":(billedTask(t.id)?"כן":"לא")])]);
  add("שעות",[["תאריך","לקוח","שנה","סוג","מקום","תיאור","שעות"],
    ...DB.time.map(x=>{const t=x.taskId?taskById(x.taskId):null;
      return [x.date,t?tName(t):"כלליות",t?t.year:"",t?t.type:"",x.office?"משרד":"בית",
        x.desc||"",num(x.hours)];})]);
  add("דרישות תשלום",[["חודש","לקוח","שנה","תאריך","שכ\"ט ללקוח","תוספת","לפי שעות","שכ\"ט מלא",
      "שעות בפועל","לפני מע\"מ","מע\"מ","סה\"כ לתשלום","שולם","יתרה","מצב","הערה"],
    ...DB.bills.map(b=>{const t=b.taskId?taskById(b.taskId):null;
      const cid=b.clientId||(t&&t.clientId);
      return [b.month,cid?clientName(cid):(t?tName(t):""),b.year,b.date,
        b.use?(b.use.share?num(b.fee):0):num(b.fee),billPart(b,"extra"),billPart(b,"rate"),billPart(b,"other"),
        b.use&&!b.use.rate&&!b.ret?0:billHours(b),
        billAmount(b),billVat(b),billTotal(b),billPaid(b),billDue(b),billStatus(b),b.note||""];})]);
  add("סיכום חודשי",[["חודש","שעות","כלליות","ימי משרד","חויב","טרם חויב","שכ\"ט שלי","מע\"מ","נסיעות","לגבייה"],
    ...(()=>{const mine2=takenTasks().filter(t=>!billedTask(t.id));
      const pend={}; mine2.forEach(t=>{const mm=t.sched?monthOf(t.sched):"";
        if(mm) pend[mm]=(pend[mm]||0)+taskMine(t);});
      const ms=[...new Set([...monthsList(),...Object.keys(pend)])].sort();
      return ms.map(m=>{const x=monthSummary(m), p=pend[m]||0;
        return [m,x.hours,x.gen,officeDays(m),x.mine,p,x.mine+p,x.vat,x.travel,x.due];});})()]);
  add("בדיקות כדאיות",[["שם","שנה","מוצר","החלטה","סיבה","שכ\"ט ללקוח","צפי שעות דקל","הערה"],
    ...DB.tasks.filter(t=>t.decision==="בבדיקה"||t.decision==="לא לקחתי"||t.checkedAt)
      .map(t=>[tName(t),t.year,t.type,t.decision||"",t.checkNote||"",num(t.fee),num(t.dekelEst),t.notes||""])]);
  XLSX.writeFile(wb,"דוחות-"+iso(today())+".xlsx");
}

$("#navUndo").onclick=()=>undoLast();
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(e.key==="z"||e.key==="Z")){
    const t=e.target&&e.target.tagName;
    if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT"||(e.target&&e.target.isContentEditable)) return;
    e.preventDefault(); undoLast(); }});
window.addEventListener("popstate",e=>{ if(e.state&&e.state.tab) showTab(e.state.tab,true); });
function boot(){
  try{history.replaceState({tab:S.tab},"");}catch(e){}
  const ok=loadLocal();
  if(!ok){ showLock(); return; }
  prevJSON=JSON.stringify(DB); UNDO=[]; setUndo();
  if(!DB.tasks.length&&!DB.clients.length) S.tab="data";
  renderAll();
  try{ autoRun(true); }catch(e){}
  if(drive.token) setTimeout(()=>driveSync(false),800); else { drive.needsAuth=true; setHdr(); }
  window.addEventListener("focus",()=>{ if(drive.token&&Date.now()-lastSync>60000) driveSync(false); });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&drive.token&&Date.now()-lastSync>60000) driveSync(false); });
  setInterval(()=>{ if(drive.token) driveSync(false); },180000);
}
function showLock(msg){
  const box=$("#lock"); box.style.display="flex";
  if(msg) $("#lockMsg").innerHTML='<span class="flag">'+msg+'</span>';
  setTimeout(()=>{const i=$("#lockPw"); i&&i.focus&&i.focus();},50);
}
function tryUnlock(){
  const cfg=lockCfg(); if(!cfg) return;
  const pw=$("#lockPw").value||"";
  const key=deriveKey(pw,cfg.salt);
  if(b64e(key)!==cfg.check){ $("#lockMsg").innerHTML='<span class="flag">סיסמה שגויה</span>'; return; }
  SKEY=key; sessionStorage.setItem("cpa-unlocked","1");
  $("#lock").style.display="none"; $("#lockPw").value="";
  boot();
}
$("#lockGo").onclick=tryUnlock;
$("#lockPw").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock();});
$("#lockReset").onclick=()=>{
  if(!confirm("איפוס ימחק את הנתונים השמורים במחשב הזה. אם יש גיבוי בדרייב אפשר לטעון אותו אחרי הכניסה. להמשיך?"))return;
  localStorage.removeItem(LS); localStorage.removeItem(LKEY); sessionStorage.removeItem("cpa-unlocked");
  location.reload();};
if(lockCfg()) showLock(); else boot();
</script>
</body>
</html>
