<style>
:root{--ink:#14303f;--ink-2:#3f5d6b;--line:#d5dfe4;--bg:#f6f8f8;--panel:#fff;
 --accent:#1f7a6b;--warn:#a85c1f;--bad:#a22f2f;--good:#1f7a4a;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--ink);color:#fff;padding:12px 14px}
header h1{margin:0;font-size:18px;font-weight:800}
header .meta{font-size:12px;opacity:.8}
nav{display:flex;gap:6px;overflow-x:auto;padding:9px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
main{padding:12px 10px 50px;max-width:1000px;margin:0 auto}
section[hidden]{display:none}
h2{font-size:15px;color:var(--ink-2);margin:18px 0 7px;font-weight:600}
h2:first-child{margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;max-width:100%}
.card .k{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.card .v{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .n{font-size:11px;color:var(--ink-2);overflow-wrap:anywhere}
.v.good{color:var(--good)}.v.bad{color:var(--bad)}.v.warn{color:var(--warn)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#eef3f4;font-size:12px;color:var(--ink-2);font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:700;background:#f2f6f7}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0}
label{font-size:13px;color:var(--ink-2)}
select,input,textarea{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
input[type=number]{width:96px}input[type=date]{width:150px}
button.act{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 15px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font:inherit;cursor:pointer}
button.mini{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:inherit;font-size:13px;cursor:pointer}
button.danger{color:var(--bad)}
.flag{color:var(--bad);font-weight:600}.ok{color:var(--good)}.mute{color:var(--ink-2);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grid2 label{display:flex;flex-direction:column;gap:3px}
details>summary{cursor:pointer;color:var(--ink-2);font-size:14px;padding:5px 2px}
.plan .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:14.5px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.plan .r:last-child{border-bottom:none}.plan .r.tot{background:#eef3f4;font-weight:700}
.plan .r b{min-width:48px;text-align:left}.plan .r span.m{min-width:70px;text-align:left;color:var(--ink-2)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.open{background:#fff5e8;border-color:#f0d3ae;color:#8a5115}
.pill.done{background:#eaf5ef;border-color:#bfe0cd;color:#1d6b46}
.pill.cancel{background:#f1f1f1;color:#6b6b6b}
#toast{position:fixed;bottom:14px;right:14px;background:var(--ink);color:#fff;padding:9px 14px;border-radius:9px;font-size:14px;opacity:0;transition:.25s;z-index:50}
#toast.show{opacity:1}
@media (max-width:680px){
 main{padding:10px 8px 40px}table{font-size:12.5px}th,td{padding:5px 6px}
 .cards{gap:6px}.card .v{font-size:18px}nav button{font-size:13.5px;padding:6px 11px}
}
@media print{nav,.noprint,header .meta{display:none!important}header{background:#fff;color:#000;border-bottom:2px solid #000}
 body{background:#fff}.scroll{border:none}th{background:#eee}@page{size:A4 landscape;margin:10mm}}
</style>

const LS="cpa-system-v2";
let DB={clients:[],tasks:[],time:[],bills:[],travel:[],
  settings:{share:1/3,target:200,targetNext:250,hoursPerDay:7,kmRate:1,inclGeneral:false},
  updated:null};
const TYPES=["דוח שנתי יחיד","דוח שנתי חברה","הצהרת הון","החזר מס","טיפול שוטף","אחר"];
const WORK=["אצלי","פנימי","מול הלקוח","מוכן","אחר"];
const SUBM=["לטיפול","הוגש","טופל","בוטל"];
function saveLocal(){DB.updated=Date.now();try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}
  if(drive.auto&&drive.token) driveSave(true);}
function loadLocal(){try{const s=localStorage.getItem(LS);if(s){const d=JSON.parse(s);DB=Object.assign(DB,d);
  DB.settings=Object.assign({share:1/3,target:200,targetNext:250,hoursPerDay:7,kmRate:1,inclGeneral:false},d.settings||{});}}catch(e){}}
const clientName=id=>{const c=DB.clients.find(c=>c.id===id);return c?c.name:"—";};
const taskById=id=>DB.tasks.find(t=>t.id===id);
const taskHours=id=>DB.time.filter(x=>x.taskId===id).reduce((s,x)=>s+num(x.hours),0);
const taskMine=t=>num(t.fee)*DB.settings.share+num(t.extra);
const taskRemaining=t=>Math.max(0,num(t.est)-taskHours(t.id));
const taskLabel=t=>`${clientName(t.clientId)} · ${t.year||""} · ${t.type||""}`;
const isOpen=t=>t.submit==="לטיפול";
const billedTask=id=>DB.bills.some(b=>b.taskId===id);
const generalHours=list=>list.filter(x=>!x.taskId).reduce((s,x)=>s+num(x.hours),0);
function billAmount(b){return b.amount!=null&&b.amount!==""?num(b.amount):num(b.fee)*DB.settings.share+num(b.extra);}
function monthTravel(m){const t=DB.travel.find(x=>x.month===m);return t?num(t.days)*num(t.km)*num(t.rate||DB.settings.kmRate):0;}
function monthsList(){
  const s=new Set([...DB.bills.map(b=>b.month),...DB.time.map(t=>monthOf(t.date)),...DB.travel.map(t=>t.month)].filter(Boolean));
  if(!s.size) s.add(iso(today()).slice(0,7));
  return [...s].sort();
}
function monthSummary(m){
  const bills=DB.bills.filter(b=>b.month===m);
  const fee=bills.reduce((s,b)=>s+num(b.fee),0), extra=bills.reduce((s,b)=>s+num(b.extra),0);
  const mine=bills.reduce((s,b)=>s+billAmount(b),0), travel=monthTravel(m);
  const time=DB.time.filter(t=>monthOf(t.date)===m);
  const hours=time.reduce((s,t)=>s+num(t.hours),0), gen=generalHours(time);
  return {m,fee,extra,mine,travel,due:mine+travel,hours,gen,bills};
}

/* ============ xlsx decrypt + import ============ */
function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function cat(){const p=[...arguments];let n=0;p.forEach(x=>n+=x.length);const o=new Uint8Array(n);let i=0;p.forEach(x=>{o.set(x,i);i+=x.length});return o;}
function le32(n){const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,n,true);return a;}
const H512=b=>new Uint8Array(sha512.arrayBuffer(b));
function utf16(s){const a=new Uint8Array(s.length*2),d=new DataView(a.buffer);for(let i=0;i<s.length;i++)d.setUint16(i*2,s.charCodeAt(i),true);return a;}
const aesDec=(k,iv,d)=>new aesjs.ModeOfOperation.cbc(k,iv).decrypt(d);
async function decryptXlsx(buf,password,onP){
  const cfb=XLSX.CFB.read(new Uint8Array(buf),{type:"array"});
  const find=n=>{const f=cfb.FileIndex.find(x=>x.name===n);if(!f)throw new Error("stream "+n);return new Uint8Array(f.content);};
  const xml=new TextDecoder("utf-8").decode(find("EncryptionInfo").slice(8)), pkg=find("EncryptedPackage");
  const kdSalt=b64((xml.match(/<keyData[^>]*>/)[0].match(/saltValue="([^"]*)"/))[1]);
  const ek=xml.match(/<p:encryptedKey[^>]*>/)[0], at=a=>(ek.match(new RegExp(a+'="([^"]*)"'))||[])[1];
  const ekSalt=b64(at("saltValue")), spin=+at("spinCount"), kb=+at("keyBits")/8, encKey=b64(at("encryptedKeyValue"));
  let h=H512(cat(ekSalt,utf16(password)));
  for(let i=0;i<spin;i++){h=H512(cat(le32(i),h)); if(onP&&i%5000===0){onP(i/spin);await new Promise(r=>setTimeout(r));}}
  const key=H512(cat(h,new Uint8Array([0x14,0x6e,0x0b,0xe7,0xab,0xac,0xd0,0xd6]))).slice(0,kb);
  const secret=aesDec(key,cat(ekSalt,new Uint8Array(16)).slice(0,16),encKey).slice(0,kb);
  const total=Number(new DataView(pkg.buffer,pkg.byteOffset).getBigUint64(0,true));
  const data=pkg.slice(8), out=new Uint8Array(Math.ceil(data.length/4096)*4096);
  for(let i=0;i*4096<data.length;i++){
    out.set(aesDec(secret,H512(cat(kdSalt,le32(i))).slice(0,16),data.slice(i*4096,(i+1)*4096)),i*4096);
  }
  const res=out.slice(0,total);
  if(!(res[0]===0x50&&res[1]===0x4b)) throw new Error("הסיסמה שגויה");
  return res;
}
const xdate=v=>{ if(v==null||v==="")return null;
  if(typeof v==="number")return iso(new Date(Math.round((v-25569)*86400000)));
  const d=new Date(v); return isNaN(d)?null:iso(d);};
function importWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const M=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):[];
  const db={clients:[],tasks:[],time:[],bills:[],travel:[],
    settings:Object.assign({},DB.settings),updated:Date.now()};
  const cl=M("לקוחות");
  const addClient=(name,type)=>{name=String(name||"").trim(); if(!name)return null;
    let c=db.clients.find(c=>c.name===name); if(c)return c.id;
    c={id:uid(),name,type:type||""}; db.clients.push(c); return c.id;};
  for(let i=3;i<cl.length;i++){ if(cl[i]&&cl[i][0]) addClient(cl[i][0],cl[i][1]); }
  const T=M("ניהול משימות");
  const hdr=(T[0]||[]).map(x=>String(x||"").trim());
  const col=(...n)=>{for(const x of n){const i=hdr.indexOf(x);if(i>=0)return i;}
    for(const x of n){const i=hdr.findIndex(h=>h.indexOf(x)===0);if(i>=0)return i;}return -1;};
  const c={name:col("שם מלא (משפחה + פרטי)","שם מלא"),year:col("שנה"),type:col("סוג"),sched:col('לו"ז',"לוז"),
    work:col("סטטוס עבודה","סטטוס"),subm:col("סטטוס הגשה","הוגש"),fee:col("שכר טרחה משרד"),
    est:col("צפי שעות"),extra:col("תוספת נטו לרונית (₪)","תוספת נטו"),notes:col("הערות"),file:col("מספר תיק")};
  const key2task={};
  for(let i=1;i<T.length;i++){
    const r=T[i]; if(!r) continue; const nm=r[c.name]; if(!nm||!String(nm).trim()) continue;
    const name=String(nm).trim();
    if(name==="כלליות") continue;
    const id=uid(), cid=addClient(name);
    const t={id,clientId:cid,year:r[c.year]||"",type:String(r[c.type]||"").trim(),
      fee:num(r[c.fee]),extra:num(r[c.extra]),est:num(r[c.est]),sched:xdate(r[c.sched]),
      work:String(r[c.work]||"").trim(),submit:String(r[c.subm]||"").trim().replace(/\s+/g," "),
      fileNo:r[c.file]||"",notes:String(r[c.notes]||"")};
    if(!SUBM.includes(t.submit)) t.submit=SUBM.find(s=>t.submit.indexOf(s)>=0)||"לטיפול";
    db.tasks.push(t);
    key2task[name+"|"+t.year]=key2task[name+"|"+t.year]||[];
    key2task[name+"|"+t.year].push(t);
  }
  const mapType=x=>{x=String(x||"").trim();
    return x==="דוח שנתי"?"דוח שנתי":(x==="ליווי שוטף"?"טיפול שוטף":x);};
  const byClient={};
  db.tasks.forEach(t=>{const n=db.clients.find(c=>c.id===t.clientId).name;(byClient[n]=byClient[n]||[]).push(t);});
  const pick=(name,year,type)=>{
    let list=key2task[name+"|"+year]||[];
    if(!list.length){
      const all=byClient[name]||[];
      if(!all.length) return null;
      if(all.length===1) return all[0];
      list=all.slice().sort((a,b)=>num(b.year)-num(a.year));
      return list[0];
    }
    const mt=mapType(type);
    return list.find(t=>t.type===mt||(mt==="דוח שנתי"&&t.type.indexOf("דוח שנתי")===0))||list[0];
  };
  wb.SheetNames.filter(n=>/^\d{4}-\d{2}$/.test(n)).sort().forEach(mn=>{
    const S=M(mn), cell=(r,cc)=>(S[r-1]&&S[r-1][cc-1]!=null)?S[r-1][cc-1]:null;
    for(let r=6;r<=70;r++){
      const d=cell(r,1), nm=cell(r,2), h=cell(r,6);
      if(!nm||!num(h)) continue;
      const name=String(nm).trim();
      if(name==="כלליות"){db.time.push({id:uid(),taskId:null,clientId:null,date:xdate(d)||(mn+"-01"),
        hours:num(h),desc:String(cell(r,5)||"כלליות")});continue;}
      const t=pick(name,cell(r,4),cell(r,3));
      db.time.push({id:uid(),taskId:t?t.id:null,clientId:t?t.clientId:addClient(name),
        date:xdate(d)||(mn+"-01"),hours:num(h),desc:String(cell(r,5)||"")});
    }
    for(let r=6;r<=25;r++){
      const nm=cell(r,15); if(!nm||!String(nm).trim()) continue;
      const name=String(nm).trim(), year=cell(r,16);
      const t=pick(name,year,null);
      const extraCell=num(cell(r,19));
      db.bills.push({id:uid(),month:mn,taskId:t?t.id:null,clientId:t?t.clientId:addClient(name),
        year:t?t.year:(year||""),date:xdate(cell(r,17))||(mn+"-01"),fee:num(cell(r,18)),
        extra:extraCell||(t?num(t.extra):0),amount:null,note:""});
    }
    const days=num(cell(52,25)),km=num(cell(53,25)),rate=num(cell(54,25));
    if(days||km) db.travel.push({month:mn,days,km,rate:rate||1});
  });
  const calc=wb.Sheets["מחשבון תיקים"], gv=a=>(calc&&calc[a]&&typeof calc[a].v==="number")?calc[a].v:null;
  const mz=wb.Sheets["מרכז"];
  db.settings.share=(mz&&mz.C3&&typeof mz.C3.v==="number")?mz.C3.v:1/3;
  db.settings.target=gv("E3")||gv("B3")||200;
  db.settings.targetNext=gv("E11")||gv("B11")||250;
  db.settings.hoursPerDay=gv("E12")||gv("B12")||7;
  return db;
}

/* ============ shared ui ============ */
function card(k,v,n,cls){return `<div class="card"><div class="k">${k}</div><div class="v ${cls||""}">${v}</div>${n?`<div class="n">${n}</div>`:""}</div>`;}
function table(head,rows,foot){
  return `<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
   <tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c==null?"":c}</td>`).join("")}</tr>`).join("")
   :`<tr><td colspan="${head.length}" class="mute">אין נתונים</td></tr>`}</tbody>
   ${foot?`<tfoot><tr>${foot.map(c=>`<td>${c==null?"":c}</td>`).join("")}</tr></tfoot>`:""}</table></div>`;}
const printBtn=()=>`<div class="row noprint"><button class="ghost" onclick="window.print()">שמירה כ־PDF / הדפסה</button></div>`;
const opts=(arr,sel)=>arr.map(o=>{const v=typeof o==="object"?o.v:o,t=typeof o==="object"?o.t:o;
  return `<option value="${esc(v)}" ${String(v)===String(sel)?"selected":""}>${esc(t)}</option>`;}).join("");
const clientOpts=sel=>opts(DB.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,"he")).map(c=>({v:c.id,t:c.name})),sel);
const pill=t=>t.submit==="לטיפול"?'<span class="pill open">לטיפול</span>':
  (t.submit==="בוטל"?'<span class="pill cancel">בוטל</span>':`<span class="pill done">${esc(t.submit)}</span>`);
const S={tab:"status"};

/* ============ views ============ */
function viewStatus(){
  const t0=today(), eom=new Date(t0.getFullYear(),t0.getMonth()+1,0), week=new Date(t0); week.setDate(week.getDate()+6);
  const open=DB.tasks.filter(isOpen);
  const inRange=(a,b)=>open.filter(t=>t.sched&&new Date(t.sched)>=a&&new Date(t.sched)<=b);
  const hrs=list=>list.reduce((s,t)=>s+taskRemaining(t),0);
  const pay=list=>list.reduce((s,t)=>{const est=num(t.est);return s+(est>0?taskRemaining(t)*(taskMine(t)/est):0);},0);
  const allHours=DB.time.reduce((s,x)=>s+num(x.hours),0), gen=generalHours(DB.time);
  const mine=DB.tasks.reduce((s,t)=>s+taskMine(t),0);
  const fee=DB.tasks.reduce((s,t)=>s+num(t.fee),0);
  const due=monthsList().reduce((s,m)=>s+monthSummary(m).due,0);
  const base=DB.settings.inclGeneral?allHours:allHours-gen;
  const rate=base>0?mine/base:null;
  const unbilled=DB.tasks.filter(t=>(t.submit==="הוגש"||t.submit==="טופל")&&!billedTask(t.id));
  let bd=0;{const d=new Date(t0);while(d<=eom){if(d.getDay()<=4)bd++;d.setDate(d.getDate()+1);}}
  const cap=bd*DB.settings.hoursPerDay, planM=hrs(inRange(t0,eom)), free=cap-planM;
  const pr=(lab,list)=>`<div class="r"><span>${lab}</span><b>${f1(hrs(list))||"0"}</b><span class="m">${pay(list)?f0(pay(list))+" ₪":"—"}</span></div>`;
  return `<h2>מצב פיננסי</h2>
  <div class="cards">
   ${card("שכ\"ט משרד",f0(fee)+" ₪","כל התיקים")}
   ${card("החלק שלך",f0(mine)+" ₪","כולל תוספות נטו")}
   ${card("שעות עבודה",f1(allHours),"מתוכן כלליות "+f1(gen))}
   ${card("₪ לשעה",f0(rate)||"—","יעד "+f0(DB.settings.target),rate==null?"":(rate>=DB.settings.target?"good":"bad"))}
   ${card("נדרש לגבייה",f0(due)+" ₪","כל התקופות")}
   ${card("טרם נדרש תשלום",unbilled.length,"תיקים שהוגשו/טופלו",unbilled.length?"bad":"good")}
   ${card("תיקים פתוחים",open.length,"צבר "+f0(open.reduce((s,t)=>s+taskMine(t),0))+" ₪")}
   ${card("שעות פנויות",f1(free),"עד סוף החודש",free<0?"bad":"")}
  </div>
  <h2>תכנון — שעות וכסף</h2>
  <div class="plan">
   ${pr("היום",inRange(t0,t0))}
   ${pr("7 הימים הקרובים",inRange(t0,week))}
   ${pr("מהיום עד סוף החודש",inRange(t0,eom))}
   ${pr("באיחור",open.filter(t=>t.sched&&new Date(t.sched)<t0))}
   ${pr("ללא תאריך",open.filter(t=>!t.sched))}
   <div class="r tot"><span>שעות פנויות עד סוף החודש</span><b>${f1(free)}</b><span class="m">קיבולת ${f1(cap)}</span></div>
  </div>
  ${unbilled.length?`<h2>דורש טיפול</h2>${table(["לקוח","שנה","סוג","סטטוס","שכ\"ט"],
    unbilled.map(t=>[clientName(t.clientId),t.year,t.type,t.submit,f0(taskMine(t))]),null)}
    <div class="mute">תיקים שהוגשו או טופלו ואין להם דרישת תשלום.</div>`:""}
  <h2>מגמה חודשית</h2>
  ${table(["חודש","שעות","מתוכן כלליות","שכ\"ט","החלק שלך","לגבייה"],
    monthsList().map(m=>{const s=monthSummary(m);
      return [m,f1(s.hours),f1(s.gen),f0(s.fee),f0(s.mine),f0(s.due)];}))}
  ${printBtn()}`;
}

function taskRow(t){
  const act=taskHours(t.id), mine=taskMine(t), est=num(t.est);
  return [clientName(t.clientId),t.year,t.type,pill(t),t.work||"",heDate(t.sched),
    f1(est),f1(act),f1(taskRemaining(t)),f0(t.fee),f0(t.extra)||"",f0(mine),
    est>0?f0(mine/est):"",act>0?f0(mine/act):"",
    billedTask(t.id)?'<span class="ok">נדרש ✓</span>':(t.submit==="לטיפול"?"":'<span class="flag">טרם נדרש</span>'),
    `<button class="mini" onclick="editTask('${t.id}')">עריכה</button>`];
}
function viewTasks(){
  const filt=S.taskFilter||"פתוחים";
  let list=DB.tasks.slice();
  if(filt==="פתוחים") list=list.filter(isOpen);
  else if(filt==="הוגשו") list=list.filter(t=>t.submit==="הוגש"||t.submit==="טופל");
  else if(filt==="בוטלו") list=list.filter(t=>t.submit==="בוטל");
  if(S.taskClient) list=list.filter(t=>t.clientId===S.taskClient);
  list.sort((a,b)=>(a.sched||"9999")>(b.sched||"9999")?1:-1);

function viewReports(){
  const r=S.rep||"open";
  const t0=today();
  const body=()=>{
    if(r==="open"){
      const list=DB.tasks.filter(isOpen).sort((a,b)=>(a.sched||"9999")>(b.sched||"9999")?1:-1);
      return `<h2>דוח תיקים פתוחים (${list.length})</h2>`+table(
        ["לקוח","שנה","סוג","סטטוס עבודה","לו\"ז","צפי שעות","שעות בפועל","שעות שנותרו"],
        list.map(t=>[clientName(t.clientId),t.year,t.type,t.work,heDate(t.sched),
          f1(t.est),f1(taskHours(t.id)),f1(taskRemaining(t))]),
        ["סה\"כ","","","","",f1(list.reduce((s,t)=>s+num(t.est),0)),
          f1(list.reduce((s,t)=>s+taskHours(t.id),0)),f1(list.reduce((s,t)=>s+taskRemaining(t),0))]);
    }
    if(r==="sched"){
      const from=S.sf||iso(t0), to=S.st||iso(new Date(t0.getFullYear(),t0.getMonth()+1,0));
      const list=DB.tasks.filter(t=>isOpen(t)&&t.sched&&t.sched>=from&&t.sched<=to).sort((a,b)=>a.sched>b.sched?1:-1);
      return `<h2>דוח לו"ז</h2>
      <div class="row noprint"><label>מ<input type="date" id="sf" value="${from}"></label>
        <label>עד<input type="date" id="st" value="${to}"></label>
        <button class="ghost" id="sWeek">שבוע</button><button class="ghost" id="sMonth">עד סוף החודש</button></div>`+
      table(["תאריך","יום","לקוח","שנה","סוג","סטטוס עבודה","שעות מתוכננות"],
        list.map(t=>[heDate(t.sched),DAYS[new Date(t.sched).getDay()],clientName(t.clientId),t.year,t.type,t.work,f1(taskRemaining(t))]),
        ["סה\"כ","","","","","",f1(list.reduce((s,t)=>s+taskRemaining(t),0))]);
    }
    if(r==="pay"){
      const ms=monthsList(), lo=S.pf&&ms.includes(S.pf)?S.pf:ms[ms.length-1], hi=S.pt&&ms.includes(S.pt)?S.pt:lo;
      const a=lo<=hi?lo:hi, b=lo<=hi?hi:lo;
      const sel=ms.filter(m=>m>=a&&m<=b).map(monthSummary);
      const sum=f=>sel.reduce((s,x)=>s+f(x),0);
      const head=`<h2>דוח דרישת תשלום — ${a===b?a:a+" עד "+b}</h2>
        <div class="row noprint"><label>מחודש<select id="pf">${opts(ms,a)}</select></label>
        <label>עד חודש<select id="pt">${opts(ms,b)}</select></label>
        <button class="ghost" id="pAll">כל התקופות</button></div>`;
      const monthly=table(["חודש","שכ\"ט משרד","שכ\"ט נוסף","החלק שלך","נסיעות","סה\"כ לגבייה"],
        sel.map(s=>[s.m,f0(s.fee),f0(s.extra),f0(s.mine),f0(s.travel),f0(s.due)]),
        sel.length>1?["סה\"כ",f0(sum(s=>s.fee)),f0(sum(s=>s.extra)),f0(sum(s=>s.mine)),f0(sum(s=>s.travel)),f0(sum(s=>s.due))]:null);
      if(a===b){
        const s=sel[0]||{bills:[],fee:0,extra:0,mine:0,travel:0,due:0};
        return head+table(["לקוח","שנה","תאריך הגשה","שכ\"ט משרד","שכ\"ט נוסף","הסכום שלך","הערה"],
          s.bills.map(x=>[clientName(x.clientId||(x.taskId&&taskById(x.taskId)||{}).clientId),
            x.year,heDate(x.date),f0(x.fee),f0(x.extra),f0(billAmount(x)),esc(x.note||"")]),
          ["סה\"כ","","",f0(s.fee),f0(s.extra),f0(s.mine),""])+monthly;
      }
      return head+monthly;
    }
    const cid=S.dc||"", yr=S.dy||"";
    const sel=DB.tasks.filter(t=>(!cid||t.clientId===cid)&&(!yr||String(t.year)===String(yr)));
    const years=[...new Set(DB.tasks.map(t=>t.year).filter(Boolean))].sort();
    const act=sel.reduce((s,t)=>s+taskHours(t.id),0), est=sel.reduce((s,t)=>s+num(t.est),0);
    const mine=sel.reduce((s,t)=>s+taskMine(t),0);
    return `<h2>לפי לקוח ושנה</h2>
      <div class="row noprint"><label>לקוח<select id="dc"><option value="">הכול</option>${clientOpts(cid)}</select></label>
      <label>שנה<select id="dy"><option value="">הכול</option>${opts(years,yr)}</select></label></div>
      <div class="cards">${card("תיקים",sel.length,"")}${card("שעות בפועל",f1(act),"צפי "+f1(est))}
      ${card("החלק שלך",f0(mine)+" ₪","")}${card("₪ לשעה",act>0?f0(mine/act):"—","בפועל")}</div>`+
      table(["לקוח","שנה","סוג","הגשה","צפי","בפועל","שכ\"ט","שלך","₪ לשעה","תשלום"],
        sel.map(t=>[clientName(t.clientId),t.year,t.type,t.submit,f1(t.est),f1(taskHours(t.id)),
          f0(t.fee),f0(taskMine(t)),taskHours(t.id)>0?f0(taskMine(t)/taskHours(t.id)):"",
          billedTask(t.id)?'<span class="ok">נדרש ✓</span>':(t.submit==="לטיפול"?"":'<span class="flag">טרם נדרש</span>')]));
  };
  return `<div class="row noprint">
    ${["open|פתוחים","sched|לו\"ז","pay|דרישת תשלום","drill|לפי לקוח"].map(x=>{const[v,t]=x.split("|");
      return `<button class="${r===v?"act":"ghost"}" onclick="S.rep='${v}';renderAll()">${t}</button>`;}).join("")}
    <button class="ghost" id="xlsx">ייצוא לאקסל</button>
  </div>${body()}${printBtn()}`;
}

function exportXlsx(){
  const wb=XLSX.utils.book_new();
  const add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name);
  add("תיקים",[["לקוח","שנה","סוג","סטטוס עבודה","סטטוס הגשה","לו\"ז","שכ\"ט משרד","תוספת נטו","החלק שלך","צפי שעות","שעות בפועל","שעות שנותרו","נדרש תשלום"],
    ...DB.tasks.map(t=>[clientName(t.clientId),t.year,t.type,t.work,t.submit,t.sched||"",num(t.fee),num(t.extra),
      taskMine(t),num(t.est),taskHours(t.id),taskRemaining(t),billedTask(t.id)?"כן":"לא"])]);
  add("שעות",[["תאריך","לקוח","שנה","סוג","תיאור","שעות"],
    ...DB.time.map(x=>{const t=x.taskId?taskById(x.taskId):null;
      return [x.date,t?clientName(t.clientId):"כלליות",t?t.year:"",t?t.type:"",x.desc||"",num(x.hours)];})]);
  add("דרישות תשלום",[["חודש","לקוח","שנה","תאריך","שכ\"ט משרד","שכ\"ט נוסף","הסכום שלך","הערה"],
    ...DB.bills.map(b=>[b.month,clientName(b.clientId||(b.taskId&&(taskById(b.taskId)||{}).clientId)),b.year,b.date,
      num(b.fee),num(b.extra),billAmount(b),b.note||""])]);
  add("סיכום חודשי",[["חודש","שעות","כלליות","שכ\"ט","נוסף","החלק שלך","נסיעות","לגבייה"],
    ...monthsList().map(m=>{const s=monthSummary(m);return [m,s.hours,s.gen,s.fee,s.extra,s.mine,s.travel,s.due];})]);
  XLSX.writeFile(wb,"דוחות-"+iso(today())+".xlsx");
}

function wireTaskForm(t){
  $("#fCancel").onclick=()=>{$("#taskForm").innerHTML="";};
  $("#fSave").onclick=()=>{
    const o={id:(t&&t.id)||uid(),clientId:$("#fClient").value,year:+$("#fYear").value||"",
      type:$("#fType").value,work:$("#fWork").value,submit:$("#fSub").value,
      fee:+$("#fFee").value||0,extra:+$("#fExtra").value||0,est:+$("#fEst").value||0,
      sched:$("#fSched").value||null,fileNo:$("#fFile").value,notes:$("#fNotes").value};
    if(!o.clientId){toast("צריך לבחור לקוח");return;}
    const i=DB.tasks.findIndex(x=>x.id===o.id);
    if(i>=0) DB.tasks[i]=Object.assign(DB.tasks[i],o); else DB.tasks.push(o);
    saveLocal();renderAll();toast("התיק נשמר");};
  if($("#fDel")) $("#fDel").onclick=()=>{if(!confirm("למחוק את התיק? רישומי השעות שלו יישארו ללא שיוך."))return;
    DB.tasks=DB.tasks.filter(x=>x.id!==t.id);DB.time.forEach(x=>{if(x.taskId===t.id)x.taskId=null;});
    saveLocal();renderAll();toast("נמחק");};
  if($("#fBill")) $("#fBill").onclick=()=>{
    const b={id:uid(),month:iso(today()).slice(0,7),taskId:t.id,clientId:t.clientId,year:t.year,
      date:iso(today()),fee:num(t.fee),extra:num(t.extra),amount:"",note:t.submit==="בוטל"?"עבודה שבוטלה":""};
    S.tab="bills";S.billMonth=b.month;renderAll();
    const box=$("#billForm");box.innerHTML=billForm(b,false);wireBillForm(b,false);box.scrollIntoView({block:"center"});};
}
function wireTimeForm(x){
  $("#hCancel").onclick=()=>{$("#timeForm").innerHTML="";};
  $("#hSave").onclick=()=>{
    const tid=$("#hTask").value||null;
    const o={id:(x&&x.id)||uid(),taskId:tid,clientId:tid?(taskById(tid)||{}).clientId:null,
      date:$("#hDate").value,hours:+$("#hHours").value||0,desc:$("#hDesc").value};
    if(!o.date||!o.hours){toast("צריך תאריך ושעות");return;}
    const i=DB.time.findIndex(t=>t.id===o.id);
    if(i>=0) DB.time[i]=o; else DB.time.push(o);
    S.timeMonth=monthOf(o.date); saveLocal();renderAll();toast("נרשם");};
  if($("#hDel")) $("#hDel").onclick=()=>{DB.time=DB.time.filter(t=>t.id!==x.id);saveLocal();renderAll();toast("נמחק");};
}
function wireBillForm(b,free){
  $("#bCancel").onclick=()=>{$("#billForm").innerHTML="";};
  $("#bSave").onclick=()=>{
    const tid=free?null:$("#bTask").value;
    const t=tid?taskById(tid):null;
    const o={id:(b&&b.id)||uid(),month:$("#bMonth").value,taskId:tid,
      clientId:free?$("#bClient").value:(t?t.clientId:null),
      year:free?$("#bYear").value:(t?t.year:""),date:$("#bDate").value,
      fee:+$("#bFee").value||0,extra:+$("#bExtra").value||0,
      amount:$("#bAmt").value===""?null:+$("#bAmt").value,note:$("#bNote").value};
    const i=DB.bills.findIndex(x=>x.id===o.id);
    if(i>=0) DB.bills[i]=o; else DB.bills.push(o);
    S.billMonth=o.month; saveLocal();renderAll();toast("נשמר בדרישת התשלום");};
  if($("#bDel")) $("#bDel").onclick=()=>{DB.bills=DB.bills.filter(x=>x.id!==b.id);saveLocal();renderAll();toast("נמחק");};
  const ts=$("#bTask");
  if(ts) ts.onchange=()=>{const t=taskById(ts.value);if(!t)return;
    $("#bFee").value=num(t.fee);$("#bExtra").value=num(t.extra);};
}
function wire(){
  const el=id=>$("#"+id);
  if(el("tf")) el("tf").onchange=e=>{S.taskFilter=e.target.value;renderAll();};
  if(el("tc")) el("tc").onchange=e=>{S.taskClient=e.target.value;renderAll();};
  if(el("tAdd")) el("tAdd").onclick=()=>{const box=$("#taskForm");box.innerHTML=taskForm(null);wireTaskForm(null);};
  if(el("tmM")) el("tmM").onchange=e=>{S.timeMonth=e.target.value;renderAll();};
  if(el("tmAdd")) el("tmAdd").onclick=()=>{const box=$("#timeForm");box.innerHTML=timeForm(null);wireTimeForm(null);};
  if(el("bM")) el("bM").onchange=e=>{S.billMonth=e.target.value;renderAll();};
  if(el("bAdd")) el("bAdd").onclick=()=>{const box=$("#billForm");box.innerHTML=billForm(null,false);wireBillForm(null,false);};
  if(el("bFree")) el("bFree").onclick=()=>{const box=$("#billForm");box.innerHTML=billForm(null,true);wireBillForm(null,true);};
  if(el("trSave")) el("trSave").onclick=()=>{const m=S.billMonth||monthsList().slice(-1)[0];
    let t=DB.travel.find(x=>x.month===m); if(!t){t={month:m};DB.travel.push(t);}
    t.days=+$("#trD").value||0;t.km=+$("#trK").value||0;t.rate=+$("#trR").value||DB.settings.kmRate;
    saveLocal();renderAll();toast("נסיעות עודכנו");};
  if(el("sf")) el("sf").onchange=e=>{S.sf=e.target.value;renderAll();};
  if(el("st")) el("st").onchange=e=>{S.st=e.target.value;renderAll();};
  if(el("sWeek")) el("sWeek").onclick=()=>{const a=today(),b=new Date(a);b.setDate(b.getDate()+6);
    S.sf=iso(a);S.st=iso(b);renderAll();};
  if(el("sMonth")) el("sMonth").onclick=()=>{const a=today();S.sf=iso(a);
    S.st=iso(new Date(a.getFullYear(),a.getMonth()+1,0));renderAll();};
  if(el("pf")) el("pf").onchange=e=>{S.pf=e.target.value;if(!S.pt||S.pt<S.pf)S.pt=S.pf;renderAll();};
  if(el("pt")) el("pt").onchange=e=>{S.pt=e.target.value;renderAll();};
  if(el("pAll")) el("pAll").onclick=()=>{const ms=monthsList();S.pf=ms[0];S.pt=ms[ms.length-1];renderAll();};
  if(el("dc")) el("dc").onchange=e=>{S.dc=e.target.value;renderAll();};
  if(el("dy")) el("dy").onchange=e=>{S.dy=e.target.value;renderAll();};
  if(el("xlsx")) el("xlsx").onclick=exportXlsx;
  if(el("xlsxOut")) el("xlsxOut").onclick=exportXlsx;
  if(el("clAdd")) el("clAdd").onclick=()=>{const n=$("#clNew").value.trim();if(!n)return;
    DB.clients.push({id:uid(),name:n,type:""});saveLocal();renderAll();toast("לקוח נוסף");};
  if(el("dSaveBtn")) el("dSaveBtn").onclick=()=>driveSave(false);
  if(el("dLoadBtn")) el("dLoadBtn").onclick=driveLoad;
  if(el("dAuto")) el("dAuto").onchange=e=>{drive.auto=e.target.checked;};
  if(el("sSave")) el("sSave").onclick=()=>{
    DB.settings.share=+$("#sShare").value||1/3;DB.settings.target=+$("#sTarget").value||200;
    DB.settings.targetNext=+$("#sNext").value||250;DB.settings.hoursPerDay=+$("#sHpd").value||7;
    DB.settings.kmRate=+$("#sKm").value||1;DB.settings.inclGeneral=$("#sGen").value==="yes";
    saveLocal();renderAll();toast("ההגדרות נשמרו");};
  if(el("jsonOut")) el("jsonOut").onclick=()=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}));
    a.download="cpa-backup-"+iso(today())+".json";a.click();};
  if(el("impGo")) el("impGo").onclick=async()=>{
    const f=$("#impFile").files[0], pw=$("#impPw").value, msg=$("#impMsg");
    if(!f){msg.textContent="צריך לבחור קובץ";return;}
    if(!confirm("הייבוא מוחק את הנתונים הקיימים במערכת. להמשיך?"))return;
    msg.textContent="קורא…";
    try{
      const buf=await f.arrayBuffer(); const head=new Uint8Array(buf.slice(0,2));
      let data=new Uint8Array(buf);
      if(!(head[0]===0x50&&head[1]===0x4b)){
        if(!pw){msg.innerHTML='<span class="flag">הקובץ מוגן בסיסמה</span>';return;}
        msg.textContent="מפענח…"; data=await decryptXlsx(buf,pw,()=>{});
      }
      const db=importWorkbook(data);
      if(!db.tasks.length){msg.innerHTML='<span class="flag">לא נמצאו תיקים. אם הקובץ נשמר בלי ערכים מחושבים — לפתוח באקסל, לשמור ולנסות שוב.</span>';return;}
      DB=db; saveLocal(); renderAll();
      msg.innerHTML=`<span class="ok">יובאו ${db.clients.length} לקוחות, ${db.tasks.length} תיקים, ${db.time.length} רישומי שעות, ${db.bills.length} שורות דרישת תשלום.</span>`;
    }catch(e){msg.innerHTML='<span class="flag">'+esc(e.message||"שגיאה")+"</span>";}
  };
}
function setHdr(){
  const st=dState();
  $("#hdr").textContent="מערכת ניהול תיקים, שעות ודרישות תשלום"+
    (st.saved?" · נשמר "+new Date(st.saved).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"");
}
function renderAll(){
  $("#s-status").innerHTML=viewStatus();
  $("#s-tasks").innerHTML=viewTasks();
  $("#s-time").innerHTML=viewTime();
  $("#s-bills").innerHTML=viewBills();
  $("#s-reports").innerHTML=viewReports();
  $("#s-clients").innerHTML=viewClients();
  $("#s-data").innerHTML=viewData();
  wire(); setHdr(); showTab(S.tab);
}
function showTab(n){
  S.tab=n;
  $$("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===n));
  ["status","tasks","time","bills","reports","clients","data"].forEach(x=>{$("#s-"+x).hidden=(x!==n);});
}
$$("#tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.t));
loadLocal();
if(!DB.tasks.length&&!DB.clients.length) S.tab="data";
renderAll();
</script>
</body>
</html>
