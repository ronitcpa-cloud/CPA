<link rel="manifest" href='data:application/manifest+json,{"name":"רונית פינץ ערוסי, רו״ח","short_name":"רונית ערוסי","start_url":".","display":"standalone","background_color":"%23f1f6fd","theme_color":"%2310306e"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10306e;--ink-2:#4a6aa5;--line:#cfe0f5;--bg:#f1f6fd;--panel:#fff;
 --accent:#1592e6;--accent-d:#0d6cb4;--accent-2:#e2f1fd;--warn:#b5651d;--bad:#c0392b;--good:#0e8f8f;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
header{background:linear-gradient(105deg,#10306e 0%,#14509e 60%,#1592e6 140%);color:#fff;padding:12px 14px}
header h1{margin:0;font-size:18px;font-weight:800}
header .meta{font-size:12px;opacity:.8}
nav{display:flex;gap:6px;overflow-x:auto;padding:9px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#navBack{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;box-shadow:0 1px 4px rgba(21,146,230,.35)}
main{padding:8px 16px 28px;max-width:1180px;margin:0 auto}
section[hidden]{display:none}
h2{font-size:13.5px;color:var(--ink-2);margin:14px 0 5px;font-weight:700;letter-spacing:-.2px}
h2:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px;align-items:stretch;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:100%;
 display:flex;flex-direction:column;justify-content:center;min-height:56px;line-height:1.25}
.card .k{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere;letter-spacing:-.1px}
.card .v{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.card .n{font-size:10.5px;color:var(--ink-2);overflow-wrap:anywhere;opacity:.85}
.v.good{color:var(--good)}.v.bad{color:var(--bad)}.v.warn{color:var(--warn)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-width:100%;width:fit-content}
table{width:auto;min-width:320px;border-collapse:collapse;font-size:13px;table-layout:auto}
th,td{padding:4px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
td[data-l="הערה"]{white-space:normal;max-width:260px;overflow-wrap:anywhere;color:var(--ink-2)}
th{background:var(--accent-2);color:var(--accent-d);font-size:12px;font-weight:700;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:700;background:#eaf4fe;color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
label{font-size:13px;color:var(--ink-2)}
select,input,textarea{font:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
input[type=number]{width:96px}input[type=date]{width:150px}
button.act{background:linear-gradient(180deg,#1b9bef,#0d7fd0);color:#fff;border:none;border-radius:8px;padding:9px 15px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font:inherit;cursor:pointer}
button.mini{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:inherit;font-size:13px;cursor:pointer}
button.danger{color:var(--bad)}
.note{display:inline-block;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 vertical-align:bottom;cursor:pointer;color:var(--ink)}
.note:hover{text-decoration:underline}
@media (max-width:680px){.note{max-width:120px}}
.flag{color:var(--bad);font-weight:600}.ok{color:var(--good)}.mute{color:var(--ink-2);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;max-width:820px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grid2 label{display:flex;flex-direction:column;gap:3px}
details>summary{cursor:pointer;color:var(--ink-2);font-size:14px;padding:5px 2px}
.plan .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:5px 9px;border-bottom:1px solid var(--line);font-size:13.5px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.plan .r:last-child{border-bottom:none}.plan .r.tot{background:#eaf4fe;font-weight:700}
.plan .r b{min-width:48px;text-align:left}.plan .r span.m{min-width:70px;text-align:left;color:var(--ink-2)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.open{background:#dff0fd;border-color:#a9d6f7;color:#0d6cb4;font-weight:600}
.pill.done{background:#e2e7fb;border-color:#bcc6f0;color:#31409b;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .h{font-size:12px;color:var(--ink-2);text-align:center;padding:2px}
.cal .d{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:62px;padding:3px 4px;font-size:11.5px;cursor:pointer}
.cal .d.off{background:#edf1f6;color:#8b99ab}
.cal .d.vac{background:#f0ebf8;color:#6b5a8a;border-color:#d9cfec}
.cal .d.vac .n{color:#5c4a80}
.cal .d.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cal .d .n{font-weight:700;font-size:12px}
.cal .d .t{font-size:10.5px;color:var(--ink-2)}
.cal .d .t.plan{color:#0d6cb4;font-weight:700}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:6px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-left:4px;vertical-align:-1px}
.cal .d .chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;margin-top:2px}
.cal .d .c{background:#dff0fd;color:#0d6cb4;border:1px solid #a9d6f7;border-radius:4px;padding:0 3px;
 font-size:9.5px;line-height:1.35;white-space:normal;overflow-wrap:anywhere;min-width:0}
.cal .d .c.done{background:#e2e7fb;color:#31409b;border-color:#bcc6f0}
.cal .d.sel{outline:2px solid var(--accent)}
.pill.cancel{background:#eff1f4;color:#7b8798;border-color:#dde3ea}
#toast{position:fixed;bottom:14px;right:14px;background:var(--ink);color:#fff;padding:9px 14px;border-radius:9px;font-size:14px;opacity:0;transition:.25s;z-index:50}
#toast.show{opacity:1}
@media (max-width:680px){
 main{padding:8px 6px 30px}
 nav{flex-wrap:wrap;overflow:visible;padding:6px;gap:4px}
 nav button,#navBack{font-size:12.5px;padding:5px 9px}

const LKEY="cpa-lock";

const b64e=u8=>btoa(String.fromCharCode.apply(null,u8));
const b64d=str=>{const b=atob(str),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
const enc=new TextEncoder(), dec=new TextDecoder();
function deriveKey(pw,salt){let h=new Uint8Array(sha512.arrayBuffer(pw+"|"+salt));
  for(let i=0;i<2000;i++) h=new Uint8Array(sha512.arrayBuffer(h)); return h.slice(0,32);}
function encryptStr(txt,key){
  const data=enc.encode(txt); const pad=16-(data.length%16);
  const buf=new Uint8Array(data.length+pad); buf.set(data); buf.fill(pad,data.length);
  const iv=new Uint8Array(16); for(let i=0;i<16;i++) iv[i]=Math.floor(Math.random()*256);
  const out=new aesjs.ModeOfOperation.cbc(key,iv).encrypt(buf);
  return b64e(iv)+"."+b64e(out);}
function decryptStr(blob,key){
  const [iv,body]=blob.split("."); const out=new aesjs.ModeOfOperation.cbc(key,b64d(iv)).decrypt(b64d(body));
  const pad=out[out.length-1]; return dec.decode(out.slice(0,out.length-pad));}

const HEB={};
function hebInfo(dt){
  const k=iso(dt); if(HEB[k]!==undefined) return HEB[k];
  let out=null;
  try{
    const p=new Intl.DateTimeFormat("en-u-ca-hebrew",{day:"numeric",month:"long"}).formatToParts(dt);
    const day=+p.find(x=>x.type==="day").value, mon=p.find(x=>x.type==="month").value;
    const M=s=>mon.indexOf(s)>=0;
    if(M("Tishri")&&(day===1||day===2)) out="ראש השנה";
    else if(M("Tishri")&&day===10) out="יום כיפור";
    else if(M("Tishri")&&day===15) out="סוכות";
    else if(M("Tishri")&&day===22) out="שמחת תורה";
    else if(M("Nisan")&&(day===15||day===21)) out="פסח";
    else if(M("Sivan")&&day===6) out="שבועות";
  }catch(e){out=null;}
  HEB[k]=out; return out;
}
function dayInfo(dt){
  const d=new Date(dt), w=d.getDay(), k=iso(d);
  if(DB.offDays.includes(k)) return {off:true,label:"חופשה"};
  if(w===5) return {off:true,label:"שישי"};
  if(w===6) return {off:true,label:"שבת"};
  const h=hebInfo(d); if(h) return {off:true,label:h};
  return {off:false,label:""};
}
function businessDays(a,b){let n=0;const d=new Date(a);
  while(d<=b){if(!dayInfo(d).off)n++;d.setDate(d.getDate()+1);}return n;}
const officeList=m=>[...new Set(DB.time.filter(t=>t.office&&monthOf(t.date)===m).map(t=>t.date))].sort();
function officeDays(m){return officeList(m).length;}
const isOfficeDay=d=>DB.time.some(t=>t.date===d&&t.office);
const PAYWAYS=["העברה בנקאית","צ׳ק","אשראי","מזומן","ביט","קיזוז","אחר"];
function billHours(b){ if(b.hours!=null&&b.hours!=="") return num(b.hours);
  return b.taskId?taskHours(b.taskId):0; }
function billRateAmount(b){return num(b.rate)*billHours(b);}
function billAmount(b){ if(b.amount!=null&&b.amount!=="") return num(b.amount);
  return num(b.fee)*DB.settings.share+num(b.extra)+billRateAmount(b);}
const billPaid=b=>(b.payments||[]).reduce((s,p)=>s+num(p.amount),0);
const billDue=b=>Math.round((billAmount(b)-billPaid(b))*100)/100;
function billStatus(b){const d=billDue(b);
  if(billPaid(b)<=0) return "פתוח";
  return d<=0.01?"שולם":"שולם חלקית";}
function monthTravel(m){const t=DB.travel.find(x=>x.month===m);
  const days=t&&t.days!=null&&t.days!==""?num(t.days):officeDays(m);
  return t?days*num(t.km)*num(t.rate||DB.settings.kmRate):officeDays(m)*0;}
function monthsList(){
  const s=new Set([...DB.bills.map(b=>b.month),...DB.time.map(t=>monthOf(t.date)),...DB.travel.map(t=>t.month),
    ...DB.plans.map(p=>monthOf(p.date)),iso(today()).slice(0,7)].filter(Boolean));
  if(!s.size) s.add(iso(today()).slice(0,7));
  return [...s].sort();
}
function timerElapsedMs(){
  const t=DB.timer; if(!t) return 0;
  return num(t.accumMs)+(t.running&&t.startedAt?(Date.now()-t.startedAt):0);
}
function fmtDur(ms){const s2=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s2/3600), m=Math.floor((s2%3600)/60), sec=s2%60;
  return pad2(h)+":"+pad2(m)+":"+pad2(sec);}
function timerHours(){return Math.round(timerElapsedMs()/36000)/100;}
function defaultMonth(){
  const ms=monthsList(), cur=iso(today()).slice(0,7);
  if(ms.includes(cur)) return cur;
  const withData=ms.filter(m=>DB.bills.some(b=>b.month===m)||DB.time.some(t=>monthOf(t.date)===m));
  return withData.length?withData[withData.length-1]:ms[ms.length-1];
}
function monthSummary(m){
  const bills=DB.bills.filter(b=>b.month===m);
  const fee=bills.reduce((s,b)=>s+num(b.fee),0), extra=bills.reduce((s,b)=>s+num(b.extra),0);
  const byRate=bills.reduce((s,b)=>s+billRateAmount(b),0);
  const hours=bills.reduce((s,b)=>s+billHours(b),0);
  const paid=bills.reduce((s,b)=>s+billPaid(b),0);

  const time=DB.time.filter(t=>monthOf(t.date)===m);
  const thours=time.reduce((s,t)=>s+num(t.hours),0), gen=generalHours(time);
  return {m,fee,extra,byRate,billHours:hours,paid,mine,travel,due:mine+travel,hours:thours,gen,bills};
}

/* ============ google drive ============ */
const GCLIENT="466114716813-rs3j8kcvj6ccljabgae4je8ktos0ehft.apps.googleusercontent.com";
const GSCOPE="https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/calendar.events";
const DKEY="cpa-system-drive";
const drive={token:null,exp:0,auto:true,silentTried:false,needsAuth:false};
const dState=()=>{try{return JSON.parse(localStorage.getItem(DKEY)||"{}")}catch(e){return{}}};
const dSave=o=>localStorage.setItem(DKEY,JSON.stringify(Object.assign(dState(),o)));
function dInfo(t,bad){const e=$("#dmsg");if(e)e.innerHTML=bad?`<span class="flag">${esc(t)}</span>`:esc(t);}
function gReady(){
  if(window.GSI_BLOCKED||!(window.google&&google.accounts&&google.accounts.oauth2)){
    dInfo("החיבור לדרייב עובד רק מהאתר שלך (github.io)",true);return false;}
  return true;}
function gAuth(cb,silent){
  if(!gReady())return;
  if(silent&&drive.silentTried){ cb&&cb(false); return; }
  if(silent) drive.silentTried=true;
  let hint=""; try{hint=localStorage.getItem("cpa-gmail")||"";}catch(e){}
  google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:GSCOPE,
    hint:hint||undefined, select_account:false,
    callback:r=>{
      if(r&&r.access_token){
        drive.token=r.access_token;
        drive.exp=Date.now()+((+r.expires_in||3000)*1000)-60000;
        drive.needsAuth=false;
        (async()=>{try{const rr=await gFetch("https://www.googleapis.com/drive/v3/about?fields=user");
          const jj=await rr.json(); if(jj&&jj.user&&jj.user.emailAddress)
            localStorage.setItem("cpa-gmail",jj.user.emailAddress);}catch(e){}})();
        const sc=r.scope||"";
        if(sc&&sc.indexOf("drive.file")<0&&!silent){ dInfo("חסרה הרשאת כתיבה לדרייב — לאשר את שתי ההרשאות במסך של גוגל",true); }
        cb&&cb(true);
      } else { drive.needsAuth=true;
        if(!silent) dInfo("ההתחברות לא הושלמה: "+((r&&r.error)||"נסגר החלון"),true);
        cb&&cb(false); }
    }
  }).requestAccessToken({prompt:silent?"":"consent"});
}
async function gFetch(url,opt){
  if(drive.exp&&Date.now()>drive.exp){ drive.token=null; throw new Error("auth"); }
  const o=opt||{};o.headers=Object.assign({Authorization:"Bearer "+drive.token},o.headers||{});
  const r=await fetch(url,o);
  if(r.status===401){drive.token=null;throw new Error("auth");}
  if(r.status===403){drive.token=null;throw new Error("אין הרשאה (403) — לאשר גישה לדרייב");}
  if(!r.ok) throw new Error("שגיאת דרייב "+r.status);
  return r;
}

async function intakePull(){

let syncBusy=false, lastSync=0;
function gAuthSilent(cb){ gAuth(cb,true); }
async function driveSync(manual){
  if(syncBusy) return; if(!drive.auto&&!manual) return;
  if(!gReady()) return;
  if(!drive.token){
    if(!manual){
      if(drive.silentTried||drive.needsAuth){ drive.needsAuth=true; setHdr(); return; }
      gAuthSilent(ok=>{ if(ok) driveSync(false); else {drive.needsAuth=true; setHdr();} });
      return;
    }
    dInfo("מתחבר לגוגל…");
    gAuth(ok=>{ if(ok){drive.silentTried=false; driveSync(true);} },true);
    setTimeout(()=>{ if(!drive.token) gAuth(ok=>{ if(ok) driveSync(true); },false); },1200);
    return; }
  syncBusy=true;
  try{
    let st=dState();
    if(!st.dataId){
      const q=encodeURIComponent("name='ronit-cpa-data.json' and trashed=false");
      const r=await gFetch("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id,modifiedTime)");
      const j=await r.json();
      if(j.files&&j.files.length){ dSave({dataId:j.files[0].id}); st=dState(); }
      else { await driveSave(true); syncBusy=false; setHdr(); return; }
    }
    const r=await gFetch("https://www.googleapis.com/drive/v3/files/"+st.dataId+"?alt=media");
    const remote=await r.json();
    const rUp=num(remote&&remote.updated), lUp=num(DB.updated);
    if(rUp>lUp+1000){ DB=Object.assign(DB,remote); DB.plans=DB.plans||[]; DB.offDays=DB.offDays||[];
      DB.officeDates=DB.officeDates||[]; migrate();
      try{localStorage.setItem(LS,SKEY?("ENC1:"+encryptStr(JSON.stringify(DB),SKEY)):JSON.stringify(DB));}catch(e){}
      renderAll(); toast("עודכן מהדרייב"); }
    else if(lUp>rUp+1000){ await driveSave(true); }
    dSave({synced:Date.now()}); lastSync=Date.now(); setHdr();
  }catch(e){
    drive.token=(e.message==="auth")?null:drive.token;
    if(manual) dInfo("הסנכרון נכשל: "+(e.message||"שגיאה")+" — אפשר לנסות שוב",true);
    syncBusy=false; if(manual&&e.message==="auth"){ gAuth(ok=>{ if(ok) driveSync(true); }); }
    return;
  }
  if(manual) dInfo("סונכרן ✓");
  syncBusy=false;
}

function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function cat(){const p=[...arguments];let n=0;p.forEach(x=>n+=x.length);const o=new Uint8Array(n);let i=0;p.forEach(x=>{o.set(x,i);i+=x.length});return o;}

const H512=b=>new Uint8Array(sha512.arrayBuffer(b));

const aesDec=(k,iv,d)=>new aesjs.ModeOfOperation.cbc(k,iv).decrypt(d);
async function decryptXlsx(buf,password,onP){
  const cfb=XLSX.CFB.read(new Uint8Array(buf),{type:"array"});
  const find=n=>{const f=cfb.FileIndex.find(x=>x.name===n);if(!f)throw new Error("stream "+n);return new Uint8Array(f.content);};
  const xml=new TextDecoder("utf-8").decode(find("EncryptionInfo").slice(8)), pkg=find("EncryptedPackage");
  const kdSalt=b64((xml.match(/<keyData[^>]*>/)[0].match(/saltValue="([^"]*)"/))[1]);
  const ek=xml.match(/<p:encryptedKey[^>]*>/)[0], at=a=>(ek.match(new RegExp(a+'="([^"]*)"'))||[])[1];
  const ekSalt=b64(at("saltValue")), spin=+at("spinCount"), kb=+at("keyBits")/8, encKey=b64(at("encryptedKeyValue"));
  let h=H512(cat(ekSalt,utf16(password)));
  for(let i=0;i<spin;i++){h=H512(cat(le32(i),h)); if(onP&&i%5000===0){onP(i/spin);await new Promise(r=>setTimeout(r));}}
  const key=H512(cat(h,new Uint8Array([0x14,0x6e,0x0b,0xe7,0xab,0xac,0xd0,0xd6]))).slice(0,kb);
  const secret=aesDec(key,cat(ekSalt,new Uint8Array(16)).slice(0,16),encKey).slice(0,kb);
  const total=Number(new DataView(pkg.buffer,pkg.byteOffset).getBigUint64(0,true));
  const data=pkg.slice(8), out=new Uint8Array(Math.ceil(data.length/4096)*4096);
  for(let i=0;i*4096<data.length;i++){
    out.set(aesDec(secret,H512(cat(kdSalt,le32(i))).slice(0,16),data.slice(i*4096,(i+1)*4096)),i*4096);
  }
  const res=out.slice(0,total);
  if(!(res[0]===0x50&&res[1]===0x4b)) throw new Error("הסיסמה שגויה");
  return res;
}

      const name=String(nm).trim();
      if(name==="כלליות"){db.time.push({id:uid(),taskId:null,clientId:null,date:xdate(d)||(mn+"-01"),
        hours:num(h),desc:String(cell(r,5)||"כלליות")});continue;}
      const t=pick(name,cell(r,4),cell(r,3));
      db.time.push({id:uid(),taskId:t?t.id:null,clientId:t?t.clientId:addClient(name),
        date:xdate(d)||(mn+"-01"),hours:num(h),desc:String(cell(r,5)||"")});
    }
    for(let r=6;r<=25;r++){
      const nm=cell(r,15); if(!nm||!String(nm).trim()) continue;
      const name=String(nm).trim(), year=cell(r,16);
      const t=pick(name,year,null);
      const extraCell=num(cell(r,19));
      db.bills.push({id:uid(),month:mn,taskId:t?t.id:null,clientId:t?t.clientId:addClient(name),
        year:t?t.year:(year||""),date:xdate(cell(r,17))||(mn+"-01"),fee:num(cell(r,18)),
        extra:extraCell||(t?num(t.extra):0),amount:null,note:""});
    }
    const days=num(cell(52,25)),km=num(cell(53,25)),rate=num(cell(54,25));
    if(days||km) db.travel.push({month:mn,days,km,rate:rate||1});
  });
  db.tasks.forEach(t=>{ t.decision="לקחתי";
    const act=db.time.filter(x=>x.taskId===t.id).reduce((s,x)=>s+num(x.hours),0);
    const rem=Math.max(0,num(t.est)-act);
    if(t.submit==="לטיפול"&&t.sched&&rem>0) db.plans.push({id:uid(),taskId:t.id,date:t.sched,hours:rem});
  });
  const calc=wb.Sheets["מחשבון תיקים"], gv=a=>(calc&&calc[a]&&typeof calc[a].v==="number")?calc[a].v:null;
  const mz=wb.Sheets["מרכז"];
  db.settings.share=(mz&&mz.C3&&typeof mz.C3.v==="number")?mz.C3.v:1/3;
  db.settings.target=gv("E3")||gv("B3")||200;
  db.settings.targetNext=gv("E11")||gv("B11")||250;
  db.settings.hoursPerDay=gv("E12")||gv("B12")||7;
  db.settings.billEmail=DB.settings.billEmail||'dekel@homek.co.il';
  return db;
}

/* ============ google calendar ============ */
function planTitle(p){const t=taskById(p.taskId); return (t?tName(t)+" · "+(t.year||"")+" "+(t.type||""):"עבודה");}
function planTimes(p){
  const start=(p.start&&/^\d{2}:\d{2}$/.test(p.start))?p.start:"09:00";
  const [hh,mm]=start.split(":").map(Number);
  const s0=new Date(p.date+"T00:00:00"); s0.setHours(hh,mm,0,0);
  const e0=new Date(s0.getTime()+Math.max(0.25,num(p.hours))*3600000);
  const f=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes())+":00";
  return {start:f(s0),end:f(e0)};
}
async function gcalUpsert(p){
  if(!DB.settings.gcal) return;
  if(!drive.token){ drive.needsAuth=true; return; }
  const t=planTimes(p);
  const body={summary:planTitle(p),description:"תוכנן במערכת רונית פינץ ערוסי, רו״ח",
    start:{dateTime:t.start,timeZone:"Asia/Jerusalem"},end:{dateTime:t.end,timeZone:"Asia/Jerusalem"}};
  try{
    const base="https://www.googleapis.com/calendar/v3/calendars/primary/events";
    const r=await gFetch(p.evId?(base+"/"+p.evId):base,
      {method:p.evId?"PATCH":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json(); if(j&&j.id){p.evId=j.id; saveLocal();}
  }catch(e){ if(e.message==="auth"){drive.token=null;drive.needsAuth=true;} }
}
async function gcalDelete(p){
  if(!p||!p.evId||!drive.token) return;
  try{ await gFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+p.evId,{method:"DELETE"}); }
  catch(e){}
}
async function gcalSyncMonth(m){
  if(!DB.settings.gcal){toast("קודם להפעיל סנכרון יומן בהגדרות");return;}
  if(!drive.token){ gAuth(ok=>{ if(ok) gcalSyncMonth(m); },false); return; }
  const list=DB.plans.filter(p=>monthOf(p.date)===m);
  for(const p of list){ await gcalUpsert(p); }
  toast("סונכרנו "+list.length+" משבצות ליומן");
}

/* ============ save reports to a folder ============ */
let repDir=null;
function idbGet(k){return new Promise(res=>{ if(!window.indexedDB) return res(null); let q; try{q=indexedDB.open("cpa-fs",1);}catch(e){return res(null);}
  q.onupgradeneeded=()=>q.result.createObjectStore("h");
  q.onsuccess=()=>{const tx=q.result.transaction("h","readonly").objectStore("h").get(k);
    tx.onsuccess=()=>res(tx.result||null); tx.onerror=()=>res(null);};
  q.onerror=()=>res(null);});}
function idbSet(k,v){return new Promise(res=>{ if(!window.indexedDB) return res(false); let q; try{q=indexedDB.open("cpa-fs",1);}catch(e){return res(false);}
  q.onupgradeneeded=()=>q.result.createObjectStore("h");
  q.onsuccess=()=>{const tx=q.result.transaction("h","readwrite").objectStore("h").put(v,k);
    tx.onsuccess=()=>res(true); tx.onerror=()=>res(false);};
  q.onerror=()=>res(false);});}
async function getReportDir(force){
  if(!window.showDirectoryPicker) return null;
  if(!force){ if(repDir) return repDir;
    let h=null; try{ h=await idbGet("dir"); }catch(e){ h=null; }
    if(h){ const perm=await h.queryPermission({mode:"readwrite"});
      if(perm==="granted"||(await h.requestPermission({mode:"readwrite"}))==="granted"){repDir=h;return h;} } }
  const h=await window.showDirectoryPicker({mode:"readwrite",id:"cpaReports",startIn:"documents"});
  repDir=h; try{ await idbSet("dir",h); }catch(e){}
  try{localStorage.setItem("cpa-repdir-name",h.name||"");}catch(e){}
  return h;
}

  a.download=fname; a.click();
  toast(msg||"הקובץ ירד לתיקיית ההורדות");

async function writeInto(dir,name,fname,html){
  let target=dir;
  try{ target=await dir.getDirectoryHandle(name,{create:true}); }
  catch(e){ target=dir; fname=name+" - "+fname; }
  const fh=await target.getFileHandle(fname,{create:true});
  const ws=await fh.createWritable();
  await ws.write(html); await ws.close();
  return (target===dir?"":name+"/")+fname;
}
async function saveReportToFolder(){
  const r=S.rep||"open", name=(typeof REPNAMES!=="undefined"&&REPNAMES[r])||"דוח";
  const sec=$("#s-reports"); if(!sec) return;
  const clone=sec.cloneNode(true);
  clone.querySelectorAll(".noprint").forEach(e=>e.remove());
  const html=reportHtml(name,clone.innerHTML);
  const d=new Date();
  const stamp=d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  const fname=`${name} ${stamp}.html`;
  if(!window.showDirectoryPicker){
    downloadReport(html,fname,"הדפדפן לא תומך בשמירה לתיקייה — הקובץ ירד לתיקיית ההורדות");
    return;}
  const attempt=async(force)=>{
    const dir=await getReportDir(force);
    if(!dir) throw new Error("no-dir");
    return await writeInto(dir,name,fname,html);
  };
  try{
    const where=await attempt(false);
    toast("נשמר: "+where);
  }catch(e1){
    if(e1&&e1.name==="AbortError"){toast("בוטל");return;}
    try{
      repDir=null; try{ await idbSet("dir",null); }catch(e){}
      const where=await attempt(true);
      toast("נשמר: "+where);
    }catch(e2){
      if(e2&&e2.name==="AbortError"){toast("בוטל");return;}
      downloadReport(html,fname,"לא ניתן לכתוב לתיקייה שנבחרה — הקובץ ירד לתיקיית ההורדות");
    }
  }
}

function exportXlsx(){
  const wb=XLSX.utils.book_new();
  const add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name);
  add("תיקים",[["לקוח","שנה","סוג","סטטוס עבודה","סטטוס הגשה","לו\"ז","שכ\"ט משרד","תוספת נטו","החלק שלך","צפי שעות","שעות בפועל","שעות שנותרו","נדרש תשלום"],
    ...DB.tasks.map(t=>[clientName(t.clientId),t.year,t.type,t.work,t.submit,t.sched||"",num(t.fee),num(t.extra),
      taskMine(t),num(t.est),taskHours(t.id),taskRemaining(t),billedTask(t.id)?"כן":"לא"])]);
  add("שעות",[["תאריך","לקוח","שנה","סוג","תיאור","שעות"],
    ...DB.time.map(x=>{const t=x.taskId?taskById(x.taskId):null;
      return [x.date,t?clientName(t.clientId):"כלליות",t?t.year:"",t?t.type:"",x.desc||"",num(x.hours)];})]);
  add("דרישות תשלום",[["חודש","לקוח","שנה","תאריך","שכ\"ט משרד","שכ\"ט נוסף","הסכום שלך","הערה"],
    ...DB.bills.map(b=>[b.month,clientName(b.clientId||(b.taskId&&(taskById(b.taskId)||{}).clientId)),b.year,b.date,
      num(b.fee),num(b.extra),billAmount(b),b.note||""])]);
  add("סיכום חודשי",[["חודש","שעות","כלליות","שכ\"ט","נוסף","החלק שלך","נסיעות","לגבייה"],
    ...monthsList().map(m=>{const s=monthSummary(m);return [m,s.hours,s.gen,s.fee,s.extra,s.mine,s.travel,s.due];})]);
  XLSX.writeFile(wb,"דוחות-"+iso(today())+".xlsx");
}

    const body=[`דרישת תשלום לחודש ${m}`,"",...lines,"",

    const saved=DB.settings.emails||[DB.settings.billEmail].filter(Boolean);
    const box=$("#billForm");

      <b>שליחת דרישת תשלום — ${m}</b>
      <div class="grid2" style="margin-top:6px">
        <label>נמען<input id="mlTo" list="mlList" value="${esc(DB.settings.billEmail||"")}">
          <datalist id="mlList">${saved.map(e=>`<option value="${esc(e)}">`).join("")}</datalist></label>
        <label>נושא<input id="mlSub" value="דרישת תשלום ${m}"></label>
      </div>
      <label style="display:block;margin-top:6px">תוכן
        <textarea id="mlBody" rows="10" style="width:100%">${esc(body)}</textarea></label>
      <div class="row">
        <button class="act" id="mlOpen">פתיחה בתוכנת המייל</button>
        <button class="ghost" id="mlCopy">העתקה ללוח</button>
        <button class="ghost" id="mlClose">סגירה</button>
      </div>
      <div id="mlMsg" class="mute">אם המייל לא נפתח — להעתיק ולהדביק בגוף ההודעה.</div>
    </div>`;
    const remember=()=>{const to=$("#mlTo").value.trim(); if(!to) return "";
      const list=[...new Set([to,...(DB.settings.emails||[])])].slice(0,10);
      DB.settings.emails=list; DB.settings.billEmail=to; saveLocal(); return to;};
    $("#mlClose").onclick=()=>{box.innerHTML="";};
    $("#mlOpen").onclick=()=>{const to=remember(); if(!to){toast("צריך נמען");return;}
      const a=document.createElement("a");
      a.href="mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent($("#mlSub").value)+
        "&body="+encodeURIComponent($("#mlBody").value);
      a.target="_blank"; document.body.appendChild(a); a.click(); a.remove();
      $("#mlMsg").innerHTML='נפתחה בקשה לתוכנת המייל. אם לא קרה כלום — אפשר להעתיק את התוכן.';};
    $("#mlCopy").onclick=async()=>{remember();
      const txt=$("#mlBody").value;
      try{ await navigator.clipboard.writeText(txt); $("#mlMsg").innerHTML='<span class="ok">הועתק ללוח ✓</span>'; }
      catch(e){ const ta=$("#mlBody"); ta.select(); document.execCommand&&document.execCommand("copy");
        $("#mlMsg").innerHTML='<span class="ok">הועתק ✓</span>'; }};
    box&&box.scrollIntoView&&box.scrollIntoView({block:"center"});};
  if(el("trSave")) el("trSave").onclick=()=>{const m=S.billMonth||defaultMonth();
    let t=DB.travel.find(x=>x.month===m); if(!t){t={month:m};DB.travel.push(t);}
    t.days=+$("#trD").value||0;t.km=+$("#trK").value||0;t.rate=+$("#trR").value||DB.settings.kmRate;
    saveLocal();renderAll();toast("נסיעות עודכנו");};
  if(el("sf")) el("sf").onchange=e=>{S.sf=e.target.value;renderAll();};
  if(el("st")) el("st").onchange=e=>{S.st=e.target.value;renderAll();};
  if(el("sToday")) el("sToday").onclick=()=>{
    const dates=DB.plans.map(p=>p.date).sort();
    S.sf=dates.length?dates[0]:iso(today()); S.st=iso(today()); renderAll(); showTab("reports");};
  if(el("sWeek")) el("sWeek").onclick=()=>{const a=today(),b=new Date(a);b.setDate(b.getDate()+6);
    S.sf=iso(a);S.st=iso(b);renderAll();};
  if(el("sMonth")) el("sMonth").onclick=()=>{const a=today();S.sf=iso(a);
    S.st=iso(new Date(a.getFullYear(),a.getMonth()+1,0));renderAll();};
  if(el("pf")) el("pf").onchange=e=>{S.pf=e.target.value;if(!S.pt||S.pt<S.pf)S.pt=S.pf;renderAll();};
  if(el("pt")) el("pt").onchange=e=>{S.pt=e.target.value;renderAll();};
  if(el("pAll")) el("pAll").onclick=()=>{const ms=monthsList();S.pf=ms[0];S.pt=ms[ms.length-1];renderAll();};
  if(el("payNote")) el("payNote").onchange=e=>{S.payNote=e.target.checked;renderAll();showTab("reports");};
  const cmap={cuStatus:"status",cuDec:"decision",cuClient:"client",cuYear:"year",cuType:"type",cuBill:"bill"};
  Object.entries(cmap).forEach(([id,key])=>{const e=el(id); if(e) e.onchange=ev=>{S.cust[key]=ev.target.value;renderAll();showTab("reports");};});
  if(el("cuGroup")) el("cuGroup").onchange=ev=>{S.cust.group=ev.target.value;renderAll();showTab("reports");};

  if(el("cuClear")) el("cuClear").onclick=()=>{S.cust=null;renderAll();showTab("reports");};
  if(el("colOpen")) el("colOpen").onchange=e=>{S.colOpen=e.target.checked;renderAll();showTab("reports");};

  if(el("repDirBtn")) el("repDirBtn").onclick=async()=>{ await getReportDir(true); toast("התיקייה נבחרה"); };
  if(el("xlsxOut")) el("xlsxOut").onclick=exportXlsx;
  if(el("clQ")) el("clQ").onchange=e=>{S.clientQ=e.target.value;renderAll();showTab("clients");};
  if(el("clFilterType")) el("clFilterType").onchange=e=>{S.clientType=e.target.value;renderAll();showTab("clients");};
  if(el("clFilterRep")) el("clFilterRep").onchange=e=>{S.clientRep=e.target.value;renderAll();showTab("clients");};
  if(el("clFilterRef")) el("clFilterRef").onchange=e=>{S.clientRef=e.target.value;renderAll();showTab("clients");};
  if(el("clClear")) el("clClear").onclick=()=>{S.clientQ="";S.clientType="";S.clientRep="";S.clientRef="";renderAll();showTab("clients");};
  if(el("inPull")) el("inPull").onclick=()=>intakePull();
  if(el("inPull2")) el("inPull2").onclick=()=>intakePull();
  if(el("inCreate")) el("inCreate").onclick=()=>intakeCreate();
  if(el("inForget")) el("inForget").onclick=()=>{ if(!confirm("לנתק את הגיליון מהמערכת? הגיליון עצמו לא יימחק."))return;
    delete DB.settings.intakeId; delete DB.settings.intakeUrl; saveLocal(); renderAll(); showTab("data"); toast("הגיליון נותק");};
  if(el("clAdd")) el("clAdd").onclick=()=>{const n=$("#clNew").value.trim();if(!n)return;
    DB.clients.push({id:uid(),name:n,type:($("#clType")||{}).value||"",fileNo:$("#clNum").value.trim()});
    saveLocal();renderAll();showTab("clients");toast("לקוח נוסף");};
  if(el("dSyncBtn")) el("dSyncBtn").onclick=()=>driveSync(true);
  if(el("dDiag")) el("dDiag").onclick=async()=>{
    const st=dState(); const L=[];
    L.push("כתובת: "+location.origin+location.pathname);
    L.push("ספריית גוגל נטענה: "+((window.google&&google.accounts&&google.accounts.oauth2)?"כן":"לא"));
    L.push("טוקן פעיל: "+(drive.token?"כן":"לא"));
    L.push("מזהה קובץ בדרייב: "+(st.dataId||"טרם נוצר"));
    L.push("סנכרון אחרון: "+(st.synced?new Date(st.synced).toLocaleString("he-IL"):"אף פעם"));
    if(drive.token){ try{ const r=await gFetch("https://www.googleapis.com/drive/v3/about?fields=user");
        const j=await r.json(); L.push("חשבון: "+((j.user&&j.user.emailAddress)||"לא ידוע")); }
      catch(e){ L.push("בדיקת חשבון נכשלה: "+e.message); } }
    dInfo(L.join(" · "));};
  if(el("dSaveBtn")) el("dSaveBtn").onclick=()=>driveSave(false);
  if(el("dLoadBtn")) el("dLoadBtn").onclick=driveLoad;
  if(el("dAuto")) el("dAuto").onchange=e=>{drive.auto=e.target.checked;};
  if(el("dBoot")) el("dBoot").onchange=e=>{try{localStorage.setItem("cpa-bootauth",e.target.checked?"1":"0");}catch(err){}
    toast(e.target.checked?"יתחבר אוטומטית בפתיחה":"לא יתחבר בפתיחה — סנכרון ידני בלבד");};
  if(el("pwSet")) el("pwSet").onclick=()=>{
    const cfg=lockCfg(), msg=$("#pwMsg");
    const nw=$("#pwNew").value, nw2=$("#pwNew2").value;
    if(cfg){ const old=$("#pwOld").value;
      if(!old||b64e(deriveKey(old,cfg.salt))!==cfg.check){msg.innerHTML='<span class="flag">הסיסמה הנוכחית שגויה</span>';return;} }
    if(!nw||nw.length<4){msg.innerHTML='<span class="flag">סיסמה של 4 תווים לפחות</span>';return;}
    if(nw!==nw2){msg.innerHTML='<span class="flag">האימות לא תואם</span>';return;}
    const salt=uid()+uid(); const key=deriveKey(nw,salt);
    localStorage.setItem(LKEY,JSON.stringify({salt,check:b64e(key)}));
    SKEY=key; saveLocal(); sessionStorage.setItem("cpa-unlocked","1"); renderAll(); showTab("data");
    toast("הסיסמה נקבעה");};
  if(el("pwOff")) el("pwOff").onclick=()=>{
    const cfg=lockCfg(), old=($("#pwOld")||{}).value||"";
    if(!cfg) return;
    if(b64e(deriveKey(old,cfg.salt))!==cfg.check){$("#pwMsg").innerHTML='<span class="flag">הסיסמה הנוכחית שגויה</span>';return;}
    localStorage.removeItem(LKEY); SKEY=null; saveLocal(); renderAll(); showTab("data"); toast("הסיסמה בוטלה");};
  if(el("sSave")) el("sSave").onclick=()=>{
    DB.settings.share=+$("#sShare").value||1/3;DB.settings.target=+$("#sTarget").value||200;
    DB.settings.targetNext=+$("#sNext").value||250;DB.settings.hoursPerDay=+$("#sHpd").value||7;
    DB.settings.kmRate=+$("#sKm").value||1;DB.settings.billEmail=$("#sMail").value.trim();DB.settings.inclGeneral=$("#sGen").value==="yes";
    DB.settings.gcal=$("#sGcal").value==="yes";
    saveLocal();renderAll();showTab("data");toast("ההגדרות נשמרו");};
  if(el("jsonOut")) el("jsonOut").onclick=()=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}));
    a.download="cpa-backup-"+iso(today())+".json";a.click();};
  if(el("jsonIn")) el("jsonIn").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    if(!confirm("טעינת הגיבוי תחליף את כל הנתונים במכשיר הזה. להמשיך?")){e.target.value="";return;}
    try{ const j=JSON.parse(await f.text());
      if(!j||!Array.isArray(j.tasks)) throw new Error("קובץ לא מתאים");
      DB=Object.assign(DB,j); DB.plans=DB.plans||[]; DB.offDays=DB.offDays||[]; DB.officeDates=DB.officeDates||[];
      migrate(); saveLocal(); renderAll(); showTab("status");
      toast("הגיבוי נטען: "+DB.tasks.length+" משימות");
    }catch(err){ toast("שגיאה: "+(err.message||"קובץ לא תקין")); }
    e.target.value="";};
  if(el("impGo")) el("impGo").onclick=async()=>{
    const f=$("#impFile").files[0], pw=$("#impPw").value, msg=$("#impMsg");
    if(!f){msg.textContent="צריך לבחור קובץ";return;}
    if(!confirm("הייבוא מוחק את הנתונים הקיימים במערכת. להמשיך?"))return;
    msg.textContent="קורא…";
    try{
      const buf=await f.arrayBuffer(); const head=new Uint8Array(buf.slice(0,2));
      let data=new Uint8Array(buf);
      if(!(head[0]===0x50&&head[1]===0x4b)){
        if(!pw){msg.innerHTML='<span class="flag">הקובץ מוגן בסיסמה</span>';return;}
        msg.textContent="מפענח…"; data=await decryptXlsx(buf,pw,()=>{});
      }
      const db=importWorkbook(data);
      if(!db.tasks.length){msg.innerHTML='<span class="flag">לא נמצאו תיקים. אם הקובץ נשמר בלי ערכים מחושבים — לפתוח באקסל, לשמור ולנסות שוב.</span>';return;}
      DB=db; migrate(); saveLocal(); renderAll();
      msg.innerHTML=`<span class="ok">יובאו ${db.clients.length} לקוחות, ${db.tasks.length} תיקים, ${db.time.length} רישומי שעות, ${db.bills.length} שורות דרישת תשלום.</span>`;
    }catch(e){msg.innerHTML='<span class="flag">'+esc(e.message||"שגיאה")+"</span>";}
  };

let tickTimer=null;
function startTick(){
  if(tickTimer) clearInterval(tickTimer);
  tickTimer=setInterval(()=>{
    const el2=document.getElementById("timerVal");
    if(el2&&DB.timer&&DB.timer.running) el2.textContent=fmtDur(timerElapsedMs());
  },1000);
}
function setHdr(){
  const st=dState();
  const sync=drive.needsAuth?"לא מחובר לדרייב"
    :(st.synced?("מסונכרן "+new Date(st.synced).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})):"לא מסונכרן");
  $("#hdr").textContent="גרסה "+VER+" · "+sync+" · "+
    (st.saved?" · נשמר "+new Date(st.saved).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"");
}
const VER="3.60.1";
function renderAll(){ try{ renderAllInner(); }catch(e){
  $("#s-status").innerHTML='<div class="panel"><b class="flag">שגיאה בתצוגה</b><div class="mute">'+esc(e.message)+'</div><pre style="white-space:pre-wrap;font-size:11px">'+esc((e.stack||"").slice(0,600))+'</pre></div>';
  showTab("status"); } }
function renderAllInner(){
  $("#s-status").innerHTML=viewStatus();
  $("#s-tasks").innerHTML=viewTasks();
  $("#s-cal").innerHTML=viewCal();
  $("#s-time").innerHTML=viewTime();
  $("#s-bills").innerHTML=viewBills();
  $("#s-reports").innerHTML=viewReports();
  $("#s-clients").innerHTML=viewClients();
  $("#s-data").innerHTML=viewData();
  wire(); setHdr(); startTick(); showTab(S.tab);
}
function showTab(n,fromPop){
  const changed=S.tab!==n;
  S.tab=n;
  if(changed&&!fromPop){ try{history.pushState({tab:n},"");}catch(e){} }
  $$("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===n));
  ["status","tasks","cal","time","bills","reports","clients","data"].forEach(x=>{$("#s-"+x).hidden=(x!==n);});
}
$$("#tabs button[data-t]").forEach(b=>b.onclick=()=>showTab(b.dataset.t));
$("#navBack").onclick=()=>{ try{history.back();}catch(e){} };
window.addEventListener("popstate",e=>{ if(e.state&&e.state.tab) showTab(e.state.tab,true); });
function boot(){
  try{history.replaceState({tab:S.tab},"");}catch(e){}
  const ok=loadLocal();
  if(!ok){ showLock(); return; }
  if(!DB.tasks.length&&!DB.clients.length) S.tab="data";
  renderAll();
  let bootAuth=true; try{bootAuth=localStorage.getItem("cpa-bootauth")!=="0";}catch(e){}
  if(bootAuth) setTimeout(()=>driveSync(false),1200);
  window.addEventListener("focus",()=>{ if(drive.token&&Date.now()-lastSync>60000) driveSync(false); });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&drive.token&&Date.now()-lastSync>60000) driveSync(false); });
  setInterval(()=>{ if(drive.token) driveSync(false); },180000);
}
function showLock(msg){
  const box=$("#lock"); box.style.display="flex";
  if(msg) $("#lockMsg").innerHTML='<span class="flag">'+msg+'</span>';
  setTimeout(()=>{const i=$("#lockPw"); i&&i.focus&&i.focus();},50);
}
function tryUnlock(){
  const cfg=lockCfg(); if(!cfg) return;
  const pw=$("#lockPw").value||"";
  const key=deriveKey(pw,cfg.salt);
  if(b64e(key)!==cfg.check){ $("#lockMsg").innerHTML='<span class="flag">סיסמה שגויה</span>'; return; }
  SKEY=key; sessionStorage.setItem("cpa-unlocked","1");
  $("#lock").style.display="none"; $("#lockPw").value="";
  boot();
}
$("#lockGo").onclick=tryUnlock;
$("#lockPw").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock();});
$("#lockReset").onclick=()=>{
  if(!confirm("איפוס ימחק את הנתונים השמורים במחשב הזה. אם יש גיבוי בדרייב אפשר לטעון אותו אחרי הכניסה. להמשיך?"))return;
  localStorage.removeItem(LS); localStorage.removeItem(LKEY); sessionStorage.removeItem("cpa-unlocked");
  location.reload();};
if(lockCfg()) showLock(); else boot();
</script>
